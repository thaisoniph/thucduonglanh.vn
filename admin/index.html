<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Quản trị Thực Dưỡng Lành</title>
  <link rel="icon" type="image/png" href="/assets/img/brand/icon-32.png">
</head>
<body>
  <script src="https://unpkg.com/@sveltia/cms@0/dist/sveltia-cms.js"></script>
  <script>
    // Màn hình đăng nhập: nút "Đăng nhập bằng GitHub" thật ra mở cửa sổ đăng nhập bằng email (api/src/cms.js) → đổi chữ cho nhân sự khỏi nhầm.
    // Ẩn nút "Đăng nhập bằng mã truy cập" (mã GitHub cá nhân, cách cũ); cần dùng thì mở /admin/?ma=1
    (function () {
      var showPat = /[?&]ma=1/.test(location.search);
      function fix() {
        document.querySelectorAll('button').forEach(function (b) {
          var t = (b.textContent || '').trim();
          if (/^Đăng nhập bằng\s*\u2068?GitHub/.test(t) || /^Sign In with\s*\u2068?GitHub/i.test(t)) {
            b.textContent = 'Đăng nhập bằng email';
            if (!b.parentNode.querySelector('.tdl-hint')) { var p = document.createElement('p'); p.className = 'tdl-hint'; p.textContent = 'Dùng email đăng nhập CRM. Mã 6 số sẽ gửi về email của bạn.'; p.style.cssText = 'margin:8px 0 0;font-size:14px;color:#555;text-align:center'; b.insertAdjacentElement('afterend', p); }
          }
          if (!showPat && /^(Đăng nhập bằng mã truy cập|Sign In Using Access Token)/i.test(t)) b.style.display = 'none';
        });
      }
      new MutationObserver(fix).observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>
</body>
</html>
