      - { label: "Ngày cập nhật", name: updated, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { label: "Mô tả ngắn dưới tiêu đề", name: description, widget: string, required: false }
      - { label: "Ẩn khỏi thanh menu", name: hidden, widget: boolean, required: false, default: false, hint: "Bật = trang riêng, chỉ ai có link mới mở được (vd hướng dẫn riêng cho 1 nhân sự)." }
      - { label: "Nội dung", name: body, widget: markdown, hint: "Mỗi tiêu đề lớn (Heading 2) tự thành 1 mục trong phần “Trong trang này”. Ảnh chụp màn hình nên che tên, số điện thoại khách thật." }

  # ------------------------------------------------------------ CÀI ĐẶT
  - name: settings
    label: "Cài đặt website"
    i18n: true
    editor: { preview: false }
    files:
      - name: site
        label: "Thông tin liên hệ, mạng xã hội, ngân hàng"
        file: data/site.{{locale}}.json
        i18n: true
        format: json
        fields:
          - { label: "Slogan", name: slogan, i18n: true, widget: string }
          - { label: "Câu giới thiệu ngắn (tiêu đề trang chủ)", name: tagline, i18n: true, widget: string }
          - { label: "Tên công ty", name: company, widget: string }
          - { label: "Mã số doanh nghiệp", name: tax_code, widget: string }
          - { label: "Ngày cấp", name: tax_date, widget: string }
          - { label: "Hotline", name: hotline, widget: string }
          - { label: "Hotline 2", name: hotline2, widget: string, required: false }
          - { label: "Số Zalo tư vấn (viết liền)", name: zalo, widget: string }
          - { label: "Email", name: email, widget: string }
          - { label: "Địa chỉ", name: address, i18n: true, widget: string }
          - { label: "Giờ làm việc", name: opening_hours, i18n: true, widget: string }
          - label: "Mạng xã hội (chân trang)"
            name: socials
            widget: object
            fields:
              - { label: "Shopee", name: shopee, widget: string, required: false }
              - { label: "Facebook", name: facebook, widget: string, required: false }
              - { label: "TikTok", name: tiktok, widget: string, required: false }
              - { label: "YouTube", name: youtube, widget: string, required: false }
              - { label: "TikTok Shop", name: tiktok_shop, widget: string, required: false }
              - { label: "Lazada", name: lazada, widget: string, required: false }
          - { label: "Link Zalo OA", name: zalo_oa, widget: string, required: false }
          - { label: "Link nhóm cộng đồng (góc trên cùng)", name: community_group, widget: string, required: false }
          - label: "Video thương hiệu (trang chủ + Giới thiệu)"
            name: brand_video
            i18n: true
            widget: object
            required: false
            fields:
              - { label: "Link YouTube", name: youtube, widget: string, required: false, hint: "Dán link video YouTube. Để trống thì ẩn khối video." }
              - { label: "Tiêu đề", name: title, i18n: true, widget: string }
              - { label: "Câu gợi tò mò", name: hook, i18n: true, widget: string, required: false, hint: "Câu chữ to trên video để khách muốn bấm xem, nên là 1 câu hỏi. Ví dụ: Vì sao một nghệ sĩ khắt khe lại chọn đồng hành lâu dài cùng Thực Dưỡng Lành?" }
              - { label: "Mô tả ngắn", name: caption, i18n: true, widget: text, required: false }
              - { label: "Ảnh bìa", name: image, widget: image, required: false, hint: "Để trống thì dùng ảnh bìa của YouTube." }
              - { label: "Nút ▶ Xem câu chuyện ở đầu trang chủ", name: hero_button, widget: boolean, default: true, required: false, hint: "Bấm nút thì video mở to giữa màn hình." }
              - { label: "Bong bóng video tròn ở góc trái màn hình", name: bubble, widget: boolean, default: true, required: false, hint: "Hiện ở trang chủ, Giới thiệu và các bài viết. Khách bấm × thì ẩn 3 ngày, khách đã xem video thì ẩn 30 ngày." }
              - { label: "Ngày đăng video (YYYY-MM-DD)", name: upload_date, widget: string, required: false }
              - { label: "Thời lượng (ví dụ PT2M9S = 2 phút 9 giây)", name: duration, widget: string, required: false }
          - label: "Nhạc nền website"
            name: music
            widget: object
            required: false
            hint: "Nút ♪ trên đầu trang để khách bật/tắt. Trình duyệt không cho phát tiếng ngay khi vừa mở trang, nên nhạc bắt đầu khi khách chạm vào trang lần đầu. Khách bấm tắt thì web nhớ, lần sau không tự phát. Khách bật video YouTube trên trang thì nhạc tự dừng, xem hết video nhạc phát tiếp."
            fields:
              - { label: "Bật nhạc nền", name: enabled, widget: boolean, default: true, hint: "Tắt: ẩn nút ♪, web không phát nhạc." }
              - { label: "Tự phát khi khách chạm trang lần đầu", name: autoplay, widget: boolean, default: true, hint: "Tắt: nhạc chỉ phát khi khách tự bấm nút ♪." }
              - { label: "Âm lượng (%)", name: volume, widget: number, value_type: int, min: 5, max: 100, default: 25, hint: "Nên để 20–30% để khách đọc không bị át." }
              - label: "Danh sách bài hát"
                name: tracks
                widget: list
                required: false
                summary: "{{fields.title}}"
                hint: "Bài ĐẦU TIÊN đang bật ô Phát sẽ phát trước; có nhiều bài thì phát lần lượt. Đổi bài: kéo bài muốn phát lên đầu, hoặc tắt ô Phát của bài cũ. Bấm nút tải file lên (KHÔNG dán link Google Drive: Drive không cho web phát, bài đó sẽ bị bỏ qua). File .mp3 hoặc .m4a, nên dưới 5 MB; bài nặng hơn (ví dụ 30 MB) hoặc lặp nhiều lần thì gửi Claude cắt và nén trước. Chỉ dùng nhạc công ty có quyền sử dụng: bài hát của ca sĩ/nhạc sĩ phải xin phép đơn vị giữ quyền, nếu không dễ bị khiếu nại bản quyền."
                fields:
                  - { label: "Tên bài", name: title, widget: string }
                  - { label: "File nhạc (.mp3, .m4a)", name: file, widget: file }
                  - { label: "Phát", name: on, widget: boolean, default: true }
          - label: "Giới thiệu bạn bè (Đại sứ Sống Lành)"
            name: referral
            widget: object
            required: false
            hint: "Chữ hiện trên trang thucduonglanh.vn/gioi-thieu-ban-be/. Mức thưởng THẬT do CRM tính (CRM → Cài đặt → 🤝 Cộng tác viên → ⚙️ Cài đặt chung): đổi ở đây thì đổi luôn ở CRM cho khớp."
            fields:
              - { label: "Hiện trang và ô giới thiệu", name: enabled, widget: boolean, default: true }
              - { label: "Bạn được giới thiệu giảm (%) đơn đầu", name: friend_pct, widget: number, value_type: int, min: 0, max: 30, default: 10 }
              - label: "Voucher cảm ơn (cộng dồn theo tổng tiền hàng người bạn mua)"
                name: reward_steps
                widget: list
                required: false
                summary: "mua đủ {{fields.min}}đ → tổng {{fields.amt}}đ"
                fields:
                  - { label: "Khi bạn mua đủ (đ)", name: min, widget: number, value_type: int, min: 0 }
                  - { label: "Tổng voucher (đ)", name: amt, widget: number, value_type: int, min: 0 }
              - { label: "Tính trong (ngày) từ đơn đầu của bạn", name: win_days, widget: number, value_type: int, min: 7, max: 365, default: 60 }
              - label: "Bậc quà (mỗi mốc tặng 1 lần)"
                name: tiers
                widget: list
                required: false
                summary: "{{fields.n}} bạn → {{fields.gift}}"
                fields:
                  - { label: "Đủ (số bạn mua)", name: n, widget: number, value_type: int, min: 1, max: 100 }
                  - { label: "Quà", name: gift, widget: string }
              - { label: "Mời làm CTV khi đủ (số bạn mua)", name: ctv_n, widget: number, value_type: int, min: 0, max: 100, default: 5 }
          - label: "Đăng ký cộng tác viên (người ngoài)"
            name: ctv_join
            widget: object
            required: false
            hint: "Chữ hiện trên trang thucduonglanh.vn/cong-tac-vien/ (người chưa mua cũng tự đăng ký được, quản lý duyệt trong CRM). Mức THẬT do CRM tính (CRM → Cài đặt → 🤝 → ⚙️ Cài đặt chung, dòng 📝): đổi ở đây thì đổi luôn ở CRM cho khớp."
            fields:
              - { label: "Hiện trang đăng ký", name: enabled, widget: boolean, default: true }
              - { label: "Hoa hồng (%) tiền hàng", name: rate, widget: number, value_type: int, min: 0, max: 50, default: 10 }
              - { label: "Tính đơn mua lại trong (tháng)", name: months, widget: number, value_type: int, min: 1, max: 36, default: 6 }
              - { label: "Khách mới của CTV giảm (%) đơn đầu", name: friend_pct, widget: number, value_type: int, min: 0, max: 30, default: 10 }
          - label: "Ưu đãi chỉ có khi đặt trên website"
            name: web_offer
            i18n: true
            widget: object
            required: false
            hint: "Giá trong từng sản phẩm vẫn nhập GIÁ GỐC. Web tự giảm theo % dưới đây, gạch giá gốc và hiện nhãn -%. CRM (đơn gọi điện/Zalo) vẫn dùng giá gốc."
            fields:
              - { label: "Bật giảm giá trên web", name: enabled, widget: boolean, default: true }
              - { label: "Mức giảm chung (%)", name: percent, widget: number, value_type: int, min: 0, max: 90, default: 15, hint: "Áp dụng cho sản phẩm để trống ô \"Giảm khi đặt trên web (%)\". Muốn giảm khác nhau thì vào từng Sản phẩm để nhập." }
              - { label: "Cộng dồn với sản phẩm đang có giá khuyến mãi riêng", name: stack_sale, widget: boolean, default: false, hint: "Tắt: sản phẩm đang có giá khuyến mãi riêng thì giữ giá khuyến mãi đó, không giảm thêm." }
              - { label: "Tiêu đề khung ưu đãi", name: label, i18n: true, widget: string, default: "Ưu đãi chỉ có khi đặt tại website" }
              - { label: "Câu quảng bá chính (dòng trên cùng + khung ưu đãi)", name: headline, i18n: true, widget: string, required: false, hint: "Ví dụ: Giá tại website luôn tốt hơn mua trên sàn. Để trống thì hiện “Giảm đến X% khi đặt trên web”." }
              - { label: "Câu quảng bá bản ngắn (điện thoại)", name: headline_short, i18n: true, widget: string, required: false, hint: "Tối đa khoảng 25 ký tự, ví dụ: Giá web tốt hơn trên sàn" }
              - { label: "Bật quà tặng", name: gift_enabled, widget: boolean, default: true }
              - { label: "Tên quà tặng", name: gift_title, widget: string, required: false }
              - { label: "Trị giá quà", name: gift_value, widget: string, required: false, hint: "Ví dụ: 999.000đ" }
              - { label: "Điều kiện nhận quà", name: gift_how, widget: string, required: false, hint: "Ví dụ: khi tham gia nhóm Zalo Cộng đồng Sống khỏe cùng Thực Dưỡng Lành" }
          - label: "Mã ưu đãi tặng sau khi nhận quà"
            name: welcome_voucher
            widget: object
            required: false
            hint: "Khách để số nhận cẩm nang/ebook/quà trò chơi hoặc vào nhóm Zalo thì thấy mã này, web tự lưu và tự trừ khi đặt hàng. Mã phải được tạo trước trong CRM → Cài đặt → 🎟 Mã ưu đãi (đang dùng SONGLANH5, giảm 5%)."
            fields:
              - { label: "Bật", name: enabled, widget: boolean, default: true }
              - { label: "Mã", name: code, widget: string, required: false }
              - { label: "Mức ưu đãi (chữ hiện cho khách)", name: label, widget: string, required: false, hint: "Ví dụ: giảm 5%" }
          - { label: "Link nhóm Zalo Sống khỏe", name: zalo_group, widget: string, required: false, hint: "Nhóm đầy thì dán link nhóm mới vào đây: mọi nút trên web và link cố định thucduonglanh.vn/nhom-zalo/ (dùng cho QR, sách cẩm nang, bài đăng) tự chuyển sang nhóm mới. Để trống thì ẩn." }
          - label: "Ebook quà tặng (trang /ebook/ + lời mời ở trang chủ, cuối bài viết, hộp tư vấn, menu)"
            name: ebook
            widget: object
            required: false
            fields:
              - { label: "Link trang ebook", name: url, widget: string, required: false, hint: "Mặc định /ebook/ (trang nhận ebook trên web, số khách vào thẳng CRM). Để trống thì ẩn toàn bộ." }
              - { label: "Link đọc ebook (Heyzine)", name: flipbook, widget: string, required: false, hint: "Khách điền tên + SĐT ở trang /ebook/ xong sẽ được mở link này. Để trống thì không có trang /ebook/." }
              - { label: "Tiêu đề", name: title, widget: string }
              - { label: "Mô tả ngắn", name: sub, widget: text, required: false }
              - { label: "Chữ trên nút", name: button, widget: string, required: false }
              - { label: "Ảnh bìa ebook", name: image, widget: image, required: false }
          - label: "Cẩm nang sống khỏe (trang /cam-nang-song-khoe/ + trang /qua-tang/ + popup khi khách sắp rời web)"
            name: camnang
            widget: object
            required: false
            fields:
              - { label: "Link trang giới thiệu", name: url, widget: string, required: false, hint: "Mặc định /cam-nang-song-khoe/ (khách điền tên, SĐT, vấn đề quan tâm → vào CRM). Để trống thì ẩn toàn bộ." }
              - { label: "Link đọc cẩm nang", name: reader, widget: string, required: false, hint: "Mặc định https://camnangsongkhoe.thucduonglanh.vn/ – khách điền form xong mới được mở." }
              - { label: "Tiêu đề", name: title, widget: string }
              - { label: "Mô tả ngắn", name: sub, widget: text, required: false }
              - { label: "Chữ trên nút", name: button, widget: string, required: false }
              - { label: "Ảnh bìa", name: image, widget: image, required: false }
              - { label: "Bật popup tặng cẩm nang khi khách sắp rời web", name: popup, widget: boolean, default: true, hint: "Chỉ hiện với khách chưa có giỏ hàng, chưa đặt đơn, chưa nhận cẩm nang; tối đa 1 lần/7 ngày." }
          - label: "Các kênh cộng đồng (trang chủ)"
            name: community
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: "Tên kênh", name: name, widget: string }
              - { label: "Số liệu", name: stat, widget: string, required: false, hint: "Ví dụ: 98.000+ người theo dõi" }
              - { label: "Link", name: url, widget: string }
              - { label: "Ảnh", name: image, widget: image }
              - { label: "Mô tả", name: desc, widget: text }
          - label: "Tài khoản nhận chuyển khoản (mã QR)"
            name: bank
            widget: object
            fields:
              - { label: "Bật thanh toán chuyển khoản", name: enabled, widget: boolean }
              - { label: "Mã ngân hàng VietQR (VCB, TCB, MB, ACB…)", name: bank_id, widget: string }
              - { label: "Tên ngân hàng hiển thị", name: bank_name, widget: string }
              - { label: "Số tài khoản", name: account_no, widget: string }
              - { label: "Chủ tài khoản (không dấu)", name: account_name, widget: string }
          - { label: "Miễn phí ship cho đơn từ (đồng, 0 = không áp dụng)", name: free_ship_threshold, widget: number, value_type: int, default: 0 }
          - { label: "Phí ship cố định (đồng, 0 = báo khi xác nhận đơn)", name: shipping_fee, widget: number, value_type: int, default: 0 }
          - label: "Hộp tư vấn nổi (góc phải màn hình máy tính)"
            name: float_chat
            widget: object
            collapsed: true
            required: false
            hint: "Bong bóng hiện khi khách bấm logo tròn góc phải hoặc ở trang khoảng 25 giây. Ô Nhận cẩm nang (đầu) và Liên hệ tư vấn (cuối) luôn có sẵn."
            fields:
              - { label: "Câu chào (tự đổi lần lượt)", name: messages, widget: list, field: { label: "Câu chào", name: message, widget: string }, hint: "Mỗi dòng 1 câu, ngắn, xưng em – gọi anh/chị. Câu đầu hiện trước. Không ghi công dụng chữa bệnh." }
              - { label: "Đổi câu sau mỗi (giây)", name: seconds, widget: number, value_type: int, default: 7, min: 3, max: 30 }
              - label: "Các nút gợi ý (nên 2–4 nút)"
                name: links
                widget: list
                summary: "{{fields.label}}"
                hint: "Ít lựa chọn thì khách dễ chọn hơn. Đường dẫn lấy phần sau thucduonglanh.vn, ví dụ /san-pham/tra-hoa-tan-dilvang-dinh-lang-che-vang/"
                fields:
                  - { label: "Chữ trên nút", name: label, widget: string }
                  - { label: "Đường dẫn", name: url, widget: string }
          - label: "Mốc đơn hàng thứ 2 trong giỏ (sau mốc miễn phí ship)"
            name: aov_milestone
            widget: object
            collapsed: true
            required: false
            hint: "Giỏ hàng hiện thanh tiến độ tới mốc này. Chỉ bật khi đã có quyền lợi THẬT, được duyệt. Không ghi quyền lợi thì web chỉ hiện nhãn trung tính, không hứa quà."
            fields:
              - { label: "Bật mốc 2", name: enabled, widget: boolean, default: false }
              - { label: "Số tiền mốc (đồng)", name: amount, widget: number, value_type: int, default: 500000 }
              - { label: "Tên mốc", name: label, widget: string, default: "Mốc 500K" }
              - { label: "Quyền lợi thật khi đạt mốc (để trống nếu chưa có)", name: reward, widget: string, required: false, hint: "Ví dụ chỉ khi đã duyệt: tặng 1 hộp trà DILVANG. Ghi đúng quyền lợi sẽ trao cho khách." }

      - name: home
        label: "Trang chủ – Ảnh lớn đầu trang & băng chuyền"
        file: data/home.{{locale}}.json
        i18n: true
        format: json
        fields:
          - label: "Ảnh lớn đầu trang (cố định, không tự chạy)"
            name: hero
            i18n: true
            widget: object
            fields:
              - { label: "Dòng nhỏ phía trên", name: eyebrow, i18n: true, widget: string, required: false }
              - { label: "Tiêu đề lớn", name: title, i18n: true, widget: string, hint: "Đặt chữ giữa hai dấu *sao* để hiện màu vàng nghiêng, ví dụ: Sống lành bắt đầu từ *10 ngày*" }
              - { label: "Câu dẫn", name: sub, i18n: true, widget: text, required: false }
              - { label: "Mã sản phẩm / gói khi bấm nút chính", name: product, widget: string, hint: "Phần cuối đường link sản phẩm, ví dụ thu-thach-10-ngay-song-lanh. Giá tự lấy theo sản phẩm." }
              - { label: "Chữ trên nút chính", name: cta, i18n: true, widget: string, hint: "Web tự thêm giá phía sau, ví dụ: Bắt đầu 10 ngày – 349.000đ" }
              - label: "Dòng tin cậy dưới nút (tối đa 3 ý ngắn)"
                name: trust
                i18n: true
                widget: list
                required: false
                summary: "{{fields.text}}"
                hint: "Chỉ ghi điều có giấy tờ thật và nói rõ áp dụng cho sản phẩm nào; nên gắn link tới mục hồ sơ của sản phẩm đó."
                fields:
                  - { label: "Nội dung", name: text, i18n: true, widget: string }
                  - { label: "Link bằng chứng", name: url, widget: string, required: false, hint: "Ví dụ: /san-pham/bua-an-dinh-duong-vitagreen/#kiem-nghiem" }
              - { label: "Ảnh (vuông)", name: image, widget: image }
          - label: "Băng chuyền sản phẩm (dưới Danh mục)"
            name: slides
            i18n: true
            widget: list
            summary: "{{fields.title}}"
            fields:
              - label: "Sản phẩm khi bấm “Mua ngay”"
                name: product
                widget: relation
                collection: products
                value_field: "{{slug}}"
                search_fields: [name]
                display_fields: [name]
              - { label: "Dòng nhỏ phía trên", name: eyebrow, i18n: true, widget: string }
              - { label: "Tiêu đề", name: title, i18n: true, widget: string, hint: "Đặt chữ giữa hai dấu *sao* để hiện màu vàng nghiêng, ví dụ: Trà Hòa Tan *DILVANG*" }
              - { label: "Mô tả", name: subtitle, i18n: true, widget: text }
              - { label: "Ảnh (vuông)", name: image, widget: image }

      - name: brochure
        label: "Hồ sơ thương hiệu (brochure)"
        file: data/brochure.json
        format: json
        fields:
          - { label: "Tiêu đề", name: title, widget: string }
          - { label: "Câu trích dẫn", name: quote, widget: text }
          - { label: "Giới thiệu ngắn", name: intro, widget: text }
          - { label: "Link sách lật Heyzine", name: flipbook_url, widget: string, hint: "Khi có bản brochure mới trên Heyzine, dán link mới vào đây." }
          - { label: "File PDF để khách tải", name: pdf, widget: file, required: false }
          - { label: "Ảnh bìa", name: cover, widget: image }
          - { label: "Số trang", name: pages, widget: number, value_type: int }
          - label: "Các chương"
            name: chapters
            widget: list
            summary: "{{fields.no}}. {{fields.title}}"
            fields:
              - { label: "Số chương", name: no, widget: string }
              - { label: "Tên chương", name: title, widget: string }
              - { label: "Mô tả", name: desc, widget: string }
          - label: "Số liệu nổi bật"
            name: stats
            widget: list
            summary: "{{fields.value}} – {{fields.label}}"
            fields:
              - { label: "Con số", name: value, widget: string }
              - { label: "Ý nghĩa", name: label, widget: string }
          - { label: "Ghi chú số liệu", name: stats_note, widget: string, required: false }
          - { label: "Giải thưởng / ghi nhận", name: award, widget: string, required: false }
          - { label: "Ghi chú giải thưởng", name: award_note, widget: text, required: false }
      - name: categories
        label: "Danh mục sản phẩm"
        file: data/categories.{{locale}}.json
        i18n: true
        format: json
        fields:
          - label: "Danh mục"
            name: categories
            i18n: true
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: "Tên danh mục", name: name, i18n: true, widget: string }
              - { label: "Mã (không dấu, dùng trên đường link)", name: slug, widget: string, hint: "Ví dụ: tra-thao-moc. Không đổi mã của danh mục đang có sản phẩm." }
              - { label: "Ảnh", name: image, widget: image }
              - { label: "Mô tả", name: desc, i18n: true, widget: text, required: false }
              - { label: "Giới thiệu chi tiết (cuối trang)", name: about, i18n: true, widget: markdown, required: false, hint: "Đoạn 100–200 chữ hiện dưới danh sách sản phẩm: danh mục gồm gì, khác biệt, ai nên dùng. Giúp trang danh mục lên Google." }

      - name: needs
        label: "Chọn theo nhu cầu"
        file: data/needs.{{locale}}.json
        i18n: true
        format: json
        fields:
          - label: "Nhu cầu"
            name: needs
            i18n: true
            widget: list
            summary: "{{fields.icon}} {{fields.name}}"
            hint: "Thẻ ở trang chủ (dưới ảnh lớn) và trang danh sách sản phẩm. Gắn sản phẩm vào nhu cầu ở ô “Nhu cầu” của từng sản phẩm. Nhu cầu chỉ có 1 sản phẩm thì bấm vào là tới thẳng sản phẩm đó. Không ghi tên bệnh hay công dụng chữa bệnh."
            fields:
              - { label: "Tên nhu cầu", name: name, i18n: true, widget: string, hint: "Ví dụ: Bữa sáng bận rộn" }
              - { label: "Mã (không dấu, dùng trên đường link)", name: slug, widget: string, hint: "Ví dụ: bua-sang-ban-ron. Link: /nhu-cau/bua-sang-ban-ron/" }
              - { label: "Biểu tượng (emoji)", name: icon, widget: string, required: false }
              - { label: "Mô tả ngắn", name: desc, i18n: true, widget: string, required: false }

      - name: quiz
        label: "Trò chơi Bạn còn mấy ngón tay"
        file: data/quiz.json
        format: json
        description: "Trang thucduonglanh.vn/ngon-tay-song-lanh/: khách trả lời từng câu, thói quen chưa làm được thì hạ một ngón tay. Chỉ có bản tiếng Việt."
        fields:
          - { label: "Tiêu đề", name: title, widget: string }
          - { label: "Lời giới thiệu", name: lead, widget: text }
          - label: "Câu hỏi"
            name: questions
            widget: list
            summary: "{{fields.icon}} {{fields.q}}"
            hint: "Nên giữ đúng 10 câu (10 ngón tay). Hỏi sao cho trả lời CÓ = thói quen tốt. Không ghi tên bệnh hay công dụng chữa bệnh."
            fields:
              - { label: "Biểu tượng (emoji)", name: icon, widget: string, required: false }
              - { label: "Câu hỏi", name: q, widget: string, hint: "Ví dụ: Bạn thường đi ngủ trước 23h?" }
              - { label: "Câu đùa nhỏ dưới câu hỏi", name: fun, widget: string, required: false }
              - { label: "Tên thói quen (ngắn)", name: habit, widget: string, hint: "Hiện ở gợi ý, thử thách 7 ngày và thống kê CRM. Ví dụ: Ngủ trước 23h. Đổi tên thì CRM tính là thói quen mới." }
              - { label: "Việc nhỏ gợi ý (khi khách hạ ngón)", name: tip, widget: text, hint: "Một việc cụ thể làm được ngay hôm nay." }
              - { label: "Gợi ý sản phẩm (không bắt buộc)", name: product, widget: relation, collection: products, value_field: "{{slug}}", search_fields: [name], display_fields: [name], required: false, hint: "Chỉ gắn khi sản phẩm thật sự liên quan. Mỗi lần chơi hiện tối đa 2 sản phẩm." }
              - { label: "Câu dẫn trước tên sản phẩm", name: product_lead, widget: string, required: false, hint: "Ví dụ: Sáng nào cũng vội?" }
          - label: "Kết quả theo số ngón còn lại"
            name: results
            widget: list
            summary: "{{fields.min}}+ ngón: {{fields.icon}} {{fields.title}}"
            fields:
              - { label: "Từ bao nhiêu ngón trở lên", name: min, widget: number, value_type: int, min: 0, max: 10 }
              - { label: "Biểu tượng", name: icon, widget: string, required: false }
              - { label: "Danh hiệu", name: title, widget: string }
              - { label: "Lời nhắn", name: text, widget: text }

      - name: chatbot
        label: "Trợ lý chat An Lành"
        file: data/chatbot.json
        format: json
        description: "Khung chat AI góc phải website. Bot tự đọc toàn bộ sản phẩm, giá, hỏi đáp, giấy tờ, chính sách trên web (sửa sản phẩm là bot biết sau vài phút). Ở đây chỉ sửa tên, câu chào, câu hỏi gợi ý, quà tặng và kiến thức thêm."
        fields:
          - { label: "Bật trợ lý chat", name: enabled, widget: boolean, default: true }
          - { label: "Tên trợ lý", name: name, widget: string, default: "An Lành" }
          - { label: "Dòng mô tả", name: role, widget: string, required: false }
          - { label: "Câu chào đầu tiên", name: greeting, widget: text, hint: "Xưng em, gọi anh/chị. Nói rõ là trợ lý ảo." }
          - { label: "Câu hỏi gợi ý (khách bấm là hỏi)", name: quick, widget: list, field: { label: "Câu hỏi", name: q, widget: string }, hint: "3–5 câu ngắn, hay gặp nhất. Không ghi tên bệnh." }
          - { label: "Mời nhận quà sau bao nhiêu câu hỏi", name: gift_after, widget: number, value_type: int, default: 2, min: 1, max: 6 }
          - { label: "Tiêu đề thẻ quà", name: gift_title, widget: string }
          - { label: "Mô tả quà", name: gift_text, widget: text, hint: "Chỉ ghi quà có thật. Khách hỏi về xương khớp thì bot tự đổi sang ebook Cơ Xương Khớp." }
          - { label: "Kiến thức thêm cho trợ lý", name: knowledge, widget: markdown, required: false, hint: "Thông tin không có trên web mà bot cần biết: câu chuyện công ty, sản phẩm chưa bán trên web, chương trình đang chạy… Chỉ ghi điều đúng, không ghi công dụng chữa bệnh." }

      - name: post_categories
        label: "Chuyên mục bài viết"
        file: data/post-categories.{{locale}}.json
        i18n: true
        format: json
        fields:
          - label: "Chuyên mục"
            name: categories
            i18n: true
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: "Tên chuyên mục", name: name, i18n: true, widget: string }
              - { label: "Mã (không dấu)", name: slug, widget: string }
