# Cấu hình trang quản trị https://thucduonglanh.vn/admin/ (Sveltia CMS)
backend:
  name: github
  repo: thaisoniph/thucduonglanh.vn
  branch: main
  # Đăng nhập bằng email như CRM (không cần tài khoản GitHub): nút "Đăng nhập bằng GitHub" mở cửa sổ của máy chủ api,
  # máy chủ lưu bài bằng mã GitHub của công ty (CRM → Cài đặt → 🌐 Trang quản trị website). Xem api/src/cms.js.
  base_url: https://api.thucduonglanh.vn
  auth_endpoint: cms/auth
  api_root: https://api.thucduonglanh.vn/gh/api/v3
  commit_messages:
    create: "Thêm {{collection}}: {{slug}}"
    update: "Cập nhật {{collection}}: {{slug}}"
    delete: "Xoá {{collection}}: {{slug}}"
    uploadMedia: "Tải ảnh {{path}}"
    deleteMedia: "Xoá ảnh {{path}}"

app_title: Quản trị website Thực Dưỡng Lành
site_url: https://thucduonglanh.vn
display_url: https://thucduonglanh.vn
logo_url: /assets/img/brand/icon-180.png
media_folder: assets/uploads
public_folder: /assets/uploads

# Đa ngôn ngữ: Tiếng Việt là bản chính (file gốc), bản dịch nằm cạnh file gốc với đuôi .en (vd content/products/abc.en.json).
# Ô có "i18n: true" = mỗi ngôn ngữ một nội dung; ô khác (giá, ảnh, mã…) chỉ sửa ở bản Tiếng Việt, bản dịch tự dùng chung.
# Thêm ngôn ngữ: thêm mã vào locales (và LANGS trong build.py + data/i18n/<mã>.json). Xem HUONG-DAN.md mục "Đa ngôn ngữ".
i18n:
  structure: multiple_files
  locales: [vi, en]
  default_locale: vi
  omit_default_locale_from_file_path: true
  initial_locales: default

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  # ------------------------------------------------------------ BÀI VIẾT
  - name: posts
    label: "Bài viết (Góc Sống Lành)"
    label_singular: "bài viết"
    description: "Bài viết hiển thị ở mục Góc Sống Lành. Bấm “Xuất bản” – khoảng 2 phút sau bài xuất hiện trên web."
    folder: content/posts
    i18n: true
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} ({{date}})"
    sortable_fields: [date, title]
    preview_path: "goc-song-lanh/{{slug}}/"
    fields:
      - { label: "Tiêu đề bài viết", name: title, i18n: true, widget: string }
      - { label: "Ngày đăng", name: date, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - label: "Chuyên mục"
        name: category
        widget: relation
        collection: settings
        file: post_categories
        value_field: "categories.*.slug"
        search_fields: ["categories.*.name"]
        display_fields: ["categories.*.name"]
      - { label: "Ảnh đại diện", name: image, widget: image, hint: "Ảnh vuông hoặc ngang, tối thiểu 1000px. Web tự nén ảnh." }
      - { label: "Mô tả ngắn", name: excerpt, i18n: true, widget: text, hint: "1–2 câu, hiện ở danh sách bài và khi chia sẻ Facebook/Zalo." }
      - { label: "Hiển thị trên web", name: published, widget: boolean, default: true, hint: "Tắt để ẩn bài mà không xoá." }
      - { label: "Nội dung", name: body, i18n: true, widget: markdown }

  # ------------------------------------------------------------ SẢN PHẨM
  - name: products
    label: "Sản phẩm"
    label_singular: "sản phẩm"
    description: "Thông tin, giá, ảnh và mô tả sản phẩm. Giá nhập bằng số, ví dụ 140000."
    folder: content/products
    i18n: true
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}}"
    sortable_fields: [order, name]
    preview_path: "san-pham/{{slug}}/"
    fields:
      - { label: "Tên sản phẩm", name: name, i18n: true, widget: string }
      - { label: "Tên ngắn", name: short_name, i18n: true, widget: string, required: false, hint: "Dùng ở nút tư vấn nổi, ví dụ: Trà DILVANG" }
      - label: "Danh mục"
        name: category
        widget: relation
        collection: settings
        file: categories
        value_field: "categories.*.slug"
        search_fields: ["categories.*.name"]
        display_fields: ["categories.*.name"]
      - { label: "Hiển thị trên web", name: published, widget: boolean, default: true, hint: "Tắt để tạm ẩn sản phẩm (hết hàng, ngừng bán)." }
      - { label: "Sản phẩm nổi bật", name: featured, widget: boolean, default: false, hint: "Hiện ở mục “Sản phẩm được yêu thích nhất” trên trang chủ." }
      - { label: "Thứ tự hiển thị", name: order, widget: number, value_type: int, default: 50, hint: "Số nhỏ đứng trước." }
      - { label: "Nhãn trên ảnh", name: badge, i18n: true, widget: string, required: false, hint: "Ví dụ: Bán chạy, Mới, Thuần chay. Để trống nếu không cần." }
      - { label: "Mã SKU", name: sku, widget: string, required: false }
      - { label: "Giá bán (đồng)", name: price, widget: number, value_type: int, required: false, hint: "Để trống = hiện “Liên hệ”. Nếu có nhiều quy cách thì nhập giá ở phần Quy cách bên dưới." }
      - { label: "Giá gốc gạch ngang (đồng)", name: regular_price, widget: number, value_type: int, required: false, hint: "Chỉ nhập khi đang giảm giá, phải lớn hơn Giá bán." }
      - { label: "Giảm khi đặt trên web (%)", name: web_discount, widget: number, value_type: int, min: 0, max: 90, required: false, hint: "Để trống = theo mức chung trong Cài đặt → Ưu đãi chỉ có khi đặt trên website. Nhập 0 = không giảm (sản phẩm giá thấp, lãi mỏng). Áp dụng cho mọi quy cách, trừ quy cách có ô riêng." }
      - { label: "Quy cách (1 loại)", name: unit, i18n: true, widget: string, required: false, hint: "Ví dụ: Chai 500ml. Bỏ qua nếu dùng nhiều quy cách." }
      - label: "Nhiều quy cách / nhiều giá"
        name: variants
        i18n: true
        widget: list
        required: false
        summary: "{{fields.name}} – {{fields.price}}đ"
        hint: "Dòng ĐẦU TIÊN luôn là hộp lẻ (gói Khởi động 10 ngày lấy dòng này). Combo đặt tên kiểu “Combo 3 hộp” hoặc “Mua 3 tặng 1” và điền Giá gốc = giá gốc 1 hộp × số hộp → web tự hiện ≈ giá/hộp, -x%, nhãn Lợi nhất và gợi ý đổi sang combo trong giỏ."
        fields:
          - { label: "Tên quy cách", name: name, i18n: true, widget: string }
          - { label: "Giá bán (đồng)", name: price, widget: number, value_type: int, required: false }
          - { label: "Giá gốc gạch ngang (đồng)", name: regular_price, widget: number, value_type: int, required: false }
          - { label: "Giảm khi đặt trên web (%) – riêng quy cách này", name: web_discount, widget: number, value_type: int, min: 0, max: 90, required: false, hint: "Để trống = theo mức của sản phẩm. Nhập 0 = quy cách này không giảm." }
          - { label: "Số gói/phần trong quy cách này", name: servings, widget: number, value_type: int, required: false, hint: "Ví dụ hộp 20 gói → 20. Web hiện “≈ 22.500đ/gói”. Để trống = không hiện." }
      - label: "Ảnh sản phẩm"
        name: images
        widget: list
        hint: "Ảnh đầu tiên là ảnh đại diện. Nên dùng ảnh vuông ≥1000px. Web tự nén ảnh."
        field: { label: "Ảnh", name: image, widget: image }
      - { label: "Mô tả ngắn (cạnh giá)", name: summary, i18n: true, widget: markdown, buttons: [bold, italic, link] }
      - { label: "Số gói/phần (sản phẩm 1 quy cách)", name: servings, widget: number, value_type: int, required: false, hint: "Ví dụ hộp 15 gói → 15. Có nhiều quy cách thì nhập ở từng quy cách." }
      - { label: "Đơn vị phần", name: serving_unit, i18n: true, widget: string, required: false, hint: "Chữ sau giá mỗi phần: gói, bữa, ly… Để trống = phần." }
      - { label: "Câu giới thiệu ngắn (gợi ý mua kèm)", name: pitch, i18n: true, widget: string, required: false, hint: "1 câu ≤ 70 chữ, nói điểm hay nhất, không ghi công dụng chữa bệnh. Hiện khi sản phẩm được gợi ý trong giỏ hàng / thanh toán. Ví dụ: 12 loại hạt, pha 1 phút cho bữa sáng bận rộn" }
      - label: "Huy hiệu chứng nhận (khung “Vì sao nên chọn”)"
        name: badges
        i18n: true
        widget: list
        required: false
        hint: "Chỉ ghi điều có giấy tờ thật, ví dụ: Kiểm nghiệm NIFC, GMP – ISO 22000:2018. Huy hiệu có chữ “kiểm nghiệm” bấm vào sẽ tới mục Tiêu chuẩn & kiểm nghiệm."
        field: { label: "Huy hiệu", name: badge, i18n: true, widget: string }
      - { label: "Ảnh phiếu kiểm nghiệm", name: test_cert_img, widget: image, required: false, hint: "Có ảnh thì bấm huy hiệu Kiểm nghiệm sẽ mở ảnh này." }
      - label: "Ảnh nhãn thật trên bao bì"
        name: label_imgs
        widget: list
        required: false
        hint: "Ảnh chụp rõ nhãn phụ / mặt sau bao bì thật. Hiện trong khung “Hồ sơ chất lượng” trên trang sản phẩm."
        field: { label: "Ảnh nhãn", name: img, widget: image }
      - label: "Hồ sơ chất lượng (phiếu kiểm nghiệm, chứng nhận…)"
        name: proofs
        i18n: true
        widget: list
        required: false
        summary: "{{fields.title}} – {{fields.org}}"
        hint: "Chỉ nhập giấy tờ có thật. Hiện trong khung “Hồ sơ chất lượng” khi khách bấm nút dưới huy hiệu."
        fields:
          - { label: "Tên giấy tờ", name: title, i18n: true, widget: string, hint: "Ví dụ: Phiếu kết quả kiểm nghiệm" }
          - { label: "Đơn vị cấp / kiểm nghiệm", name: org, i18n: true, widget: string, required: false, hint: "Ví dụ: Viện Kiểm nghiệm ATVSTP Quốc gia (NIFC)" }
          - { label: "Số hiệu", name: number, i18n: true, widget: string, required: false }
          - { label: "Ngày cấp / ngày kiểm nghiệm", name: date, i18n: true, widget: string, required: false, hint: "Ví dụ: 12/03/2025" }
          - { label: "Phạm vi áp dụng / chỉ tiêu", name: scope, i18n: true, widget: string, required: false, hint: "Ví dụ: hóa lý, vi sinh, kim loại nặng – lô sản xuất 03/2025" }
          - { label: "Ảnh hoặc file PDF", name: file, widget: file, required: false }
      - label: "Nhu cầu"
        name: needs
        widget: relation
        collection: settings
        file: needs
        value_field: "needs.*.slug"
        search_fields: ["needs.*.name"]
        display_fields: ["needs.*.name"]
        multiple: true
        required: false
        hint: "Sản phẩm hiện ở các thẻ “Chọn theo nhu cầu” nào."
      - label: "Đánh giá khách hàng (chỉ nhập đánh giá thật)"
        name: reviews
        i18n: true
        widget: list
        required: false
        summary: "{{fields.name}} – {{fields.rating}}★"
        hint: "Hiện ở khối “Khách hàng nói gì” trên trang sản phẩm. Từ 3 đánh giá có chấm sao trở lên, web mới hiện sao trung bình trên thẻ sản phẩm và gửi cho Google. Không tự tạo đánh giá."
        fields:
          - { label: "Tên khách", name: name, widget: string, hint: "Có thể viết tắt: Chị Lan" }
          - { label: "Nơi ở / nghề nghiệp", name: location, i18n: true, widget: string, required: false }
          - { label: "Số sao (1–5)", name: rating, widget: number, value_type: int, min: 1, max: 5, required: false }
          - { label: "Lời nhận xét", name: text, i18n: true, widget: text, required: false }
          - { label: "Ảnh (ảnh chụp tin nhắn / ảnh khách gửi)", name: img, widget: image, required: false, hint: "Có video thì ảnh này làm ảnh bìa video." }
          - { label: "Video (link YouTube hoặc file .mp4)", name: video, widget: string, required: false }
      - label: "Từ khóa tìm kiếm (không hiện ra web)"
        name: keywords
        i18n: true
        widget: list
        required: false
        hint: "Khách gõ các từ này (có dấu hay không dấu đều được) sẽ tìm ra sản phẩm. Ví dụ: ăn sáng, bữa phụ, ăn chay. Từ đứng trước ưu tiên hơn. Chỉ dùng để tìm, không hiện ra web."
        field: { label: "Từ khóa", name: keyword, i18n: true, widget: string }
      - label: "Điểm nổi bật (dấu tích xanh)"
        name: highlights
        i18n: true
        widget: list
        required: false
        field: { label: "Điểm nổi bật", name: text, i18n: true, widget: string }
      - label: "Các mục mô tả chi tiết"
        name: sections
        i18n: true
        widget: list
        required: false
        summary: "{{fields.title}}"
        hint: "Mỗi mục là 1 khối: Thành phần, Công dụng, Cách dùng, Bảo quản…"
        fields:
          - { label: "Tiêu đề mục", name: title, i18n: true, widget: string }
          - label: "Kiểu trình bày"
            name: style
            widget: select
            default: box
            options:
              - { label: "Đoạn văn trong khung xám", value: box }
              - { label: "Đoạn văn có viền xanh bên trái", value: quote }
              - { label: "Danh sách gạch đầu dòng", value: list }
              - { label: "Bảng thông số (2 cột)", value: table }
          - { label: "Nội dung (khi chọn Đoạn văn)", name: text, i18n: true, widget: markdown, required: false }
          - label: "Các dòng (khi chọn Danh sách)"
            name: items
            i18n: true
            widget: list
            required: false
            field: { label: "Dòng", name: item, i18n: true, widget: string }
          - label: "Các dòng bảng (khi chọn Bảng)"
            name: rows
            i18n: true
            widget: list
            required: false
            summary: "{{fields.label}}: {{fields.value}}"
            fields:
              - { label: "Tên", name: label, i18n: true, widget: string }
              - { label: "Giá trị", name: value, i18n: true, widget: string }
      - label: "Câu chuyện sản phẩm (từ vùng nguyên liệu đến tay khách)"
        name: story
        i18n: true
        widget: object
        required: false
        collapsed: true
        hint: "Khối kể hành trình có ảnh, hiện dưới phần mua hàng (trang sản phẩm, mục #cau-chuyen). Để trống các chặng thì không hiện. Chỉ ghi điều có thật, có ảnh/giấy tờ chứng minh."
        fields:
          - { label: "Hiện ở trang chủ", name: home, widget: boolean, default: false, required: false, hint: "Bật cho 1 sản phẩm: trang chủ có khối 'Từ vùng nguyên liệu' lấy 3 ảnh đầu." }
          - { label: "Chữ nhỏ phía trên", name: eyebrow, i18n: true, widget: string, required: false, hint: "Ví dụ: Câu chuyện DILVANG" }
          - { label: "Tiêu đề", name: title, i18n: true, widget: string, required: false }
          - { label: "Đoạn mở đầu", name: intro, i18n: true, widget: markdown, required: false }
          - { label: "Tiêu đề ở trang chủ", name: home_title, i18n: true, widget: string, required: false }
          - { label: "Đoạn văn ở trang chủ", name: home_text, i18n: true, widget: markdown, required: false }
          - label: "Các chặng hành trình"
            name: steps
            i18n: true
            widget: list
            required: false
            summary: "{{fields.title}}"
            hint: "Nên 3 hoặc 6 chặng (máy tính hiện 3 cột). Ảnh ngang, rộng ≥ 1000px."
            fields:
              - { label: "Ảnh", name: image, widget: image, required: false }
              - { label: "Mô tả ảnh (cho người khiếm thị, Google)", name: alt, i18n: true, widget: string, required: false }
              - { label: "Tiêu đề chặng", name: title, i18n: true, widget: string }
              - { label: "Nội dung", name: text, i18n: true, widget: markdown, required: false }
          - label: "Con số nổi bật"
            name: facts
            i18n: true
            widget: list
            required: false
            summary: "{{fields.value}} – {{fields.label}}"
            fields:
              - { label: "Con số", name: value, i18n: true, widget: string, hint: "Ví dụ: 4.750 m²" }
              - { label: "Ý nghĩa", name: label, i18n: true, widget: string }
          - label: "Báo chí đưa tin"
            name: press
            i18n: true
            widget: list
            required: false
            summary: "{{fields.org}} – {{fields.title}}"
            fields:
              - { label: "Tên báo / kênh", name: org, i18n: true, widget: string }
              - { label: "Ngày đăng", name: date, i18n: true, widget: string, required: false }
              - { label: "Tiêu đề bài", name: title, i18n: true, widget: string }
              - { label: "Link bài", name: url, widget: string }
              - { label: "Tóm tắt ngắn", name: summary, i18n: true, widget: text, required: false }
          - label: "Video câu chuyện (YouTube)"
            name: video
            i18n: true
            widget: object
            required: false
            collapsed: true
            hint: "Hiện khung video 16:9 ngay dưới đoạn mở đầu. Chỉ tải YouTube khi khách bấm xem."
            fields:
              - { label: "Link YouTube", name: youtube, widget: string, required: false }
              - { label: "Tiêu đề video", name: title, i18n: true, widget: string, required: false }
              - { label: "Mô tả ngắn", name: caption, i18n: true, widget: string, required: false }
              - { label: "Ảnh bìa (để trống = ảnh của YouTube)", name: image, widget: image, required: false }
              - { label: "Ngày đăng video (YYYY-MM-DD)", name: upload_date, widget: string, required: false }
          - label: "Câu trích dẫn"
            name: quote
            i18n: true
            widget: object
            required: false
            collapsed: true
            fields:
              - { label: "Câu nói (không cần ngoặc kép)", name: text, i18n: true, widget: text, required: false }
              - { label: "Người nói / nguồn", name: by, i18n: true, widget: string, required: false }
          - label: "Lời của Thực Dưỡng Lành"
            name: pledge
            i18n: true
            widget: object
            required: false
            collapsed: true
            hint: "Khung thư ngắn: vì sao công ty chọn sản phẩm này."
            fields:
              - { label: "Tiêu đề", name: title, i18n: true, widget: string, required: false }
              - { label: "Nội dung", name: text, i18n: true, widget: markdown, required: false }
              - { label: "Ký tên", name: sign, i18n: true, widget: string, required: false }
              - label: "Ảnh thật (đội ngũ, chuyến thăm…)"
                name: images
                i18n: true
                widget: list
                required: false
                summary: "{{fields.caption}}"
                fields:
                  - { label: "Ảnh", name: image, widget: image }
                  - { label: "Chú thích", name: caption, i18n: true, widget: string, required: false }
          - { label: "Link đọc thêm", name: link, widget: string, required: false, hint: "Ví dụ link bài viết: /goc-song-lanh/ten-bai/" }
          - { label: "Chữ trên nút đọc thêm", name: link_text, i18n: true, widget: string, required: false }
      - label: "Gợi ý mua kèm"
        name: upsell
        widget: relation
        collection: products
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
        multiple: true
        required: false
        hint: "Sản phẩm ưu tiên gợi ý khi khách mua sản phẩm này. Để trống thì web tự gợi ý món giúp đơn đạt mức miễn phí vận chuyển."
      - { label: "Dòng lưu ý cuối trang", name: disclaimer, i18n: true, widget: text, required: false, hint: "Ví dụ: Sản phẩm này không phải là thuốc và không có tác dụng thay thế thuốc chữa bệnh." }
      - { label: "Nhà sản xuất", name: manufacturer, widget: string, required: false, hint: "Tên đơn vị sản xuất đúng như trên nhãn / hồ sơ công bố. Dùng cho Google và công cụ AI, không hiện trên trang." }
      - label: "Hỏi đáp (câu hỏi thường gặp)"
        name: faq
        i18n: true
        widget: list
        required: false
        summary: "{{fields.q}}"
        hint: "Hiện cuối trang sản phẩm, giúp Google và ChatGPT/Gemini trả lời đúng khi khách hỏi. Chỉ ghi đúng hồ sơ công bố, không dùng chữ chữa/điều trị/khỏi bệnh. Câu \"Mua ở đâu, phí ship bao nhiêu\" web tự thêm, không cần nhập."
        fields:
          - { label: "Câu hỏi", name: q, i18n: true, widget: string, hint: "Viết như khách hỏi thật, ví dụ: Pha trà thế nào? Mỗi ngày uống mấy gói?" }
          - { label: "Trả lời", name: a, i18n: true, widget: markdown, hint: "Trả lời thẳng ngay câu đầu, 1–4 câu, có số liệu cụ thể." }

  # ------------------------------------------------------------ GÓI GIẢI PHÁP (COMBO)
  - name: combos
    label: "Gói giải pháp"
    label_singular: "gói"
    description: "Combo nhiều sản phẩm bán theo 1 giá (ví dụ Gói Khởi Động 10 Ngày Sống Lành). Web tự hiện ở trang chủ, danh mục Gói Giải Pháp, và gợi ý ở trang các sản phẩm có trong gói."
    folder: content/combos
    i18n: true
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}} – {{price}}đ"
    sortable_fields: [order, name]
    preview_path: "san-pham/{{slug}}/"
    fields:
      - { label: "Tên gói", name: name, i18n: true, widget: string, hint: "Ví dụ: Gói Khởi Động 10 Ngày Sống Lành. Tên đầy đủ dùng trong giỏ hàng, đơn hàng, CRM." }
      - { label: "Tên ngắn", name: short_name, i18n: true, widget: string, required: false }
      - { label: "Hiển thị trên web", name: published, widget: boolean, default: true }
      - { label: "Nổi bật (hiện ở hộp tư vấn)", name: featured, widget: boolean, default: true }
      - { label: "Thứ tự hiển thị", name: order, widget: number, value_type: int, default: 1, hint: "Số nhỏ đứng trước." }
      - { label: "Nhãn trên ảnh", name: badge, i18n: true, widget: string, required: false, default: "Gói giải pháp" }
      - label: "Sản phẩm trong gói"
        name: items
        i18n: true
        widget: list
        summary: "{{fields.qty}} × {{fields.product}} {{fields.variant}}"
        hint: "Chọn từng sản phẩm, gõ đúng tên quy cách (ví dụ: Hộp 125g). Sản phẩm 1 quy cách thì để trống ô quy cách. Web tự cộng giá gốc để hiện số tiền tiết kiệm."
        fields:
          - { label: "Sản phẩm", name: product, widget: relation, collection: products, value_field: "{{slug}}", search_fields: [name], display_fields: [name] }
          - { label: "Quy cách", name: variant, widget: string, required: false, hint: "Ví dụ: Hộp 125g. Để trống = quy cách đầu tiên." }
          - { label: "Số lượng", name: qty, widget: number, value_type: int, default: 1, min: 1 }
          - { label: "Biểu tượng", name: icon, widget: string, required: false, hint: "1 emoji, ví dụ 🥣 🥛 🍵" }
          - { label: "Lợi ích (chữ to)", name: benefit, i18n: true, widget: string, required: false, hint: "Ví dụ: Ăn lành hơn. Có ô này thì sản phẩm hiện thành 1 lợi ích ở thẻ gói trang chủ và trang gói." }
          - { label: "Tên hiển thị (chữ nhỏ)", name: title, i18n: true, widget: string, required: false, hint: "Ví dụ: Trà DILVANG. Để trống = tên sản phẩm." }
          - { label: "Câu ngắn (trang chủ)", name: note, i18n: true, widget: string, required: false }
          - { label: "Mô tả (trang gói)", name: detail, i18n: true, widget: text, required: false }
          - { label: "Thông điệp ngắn (trang gói)", name: quote, i18n: true, widget: string, required: false }
      - { label: "Giá gói (đồng)", name: price, widget: number, value_type: int, hint: "Nên thấp hơn tổng giá mua lẻ trên web (đã giảm %) để khách thấy lợi khi mua gói. Web hiện cả 2 mức tiết kiệm." }
      - { label: "Miễn phí vận chuyển", name: free_ship, widget: boolean, default: true, hint: "Bật: đơn có gói này được miễn phí ship." }
      - { label: "Số ngày dùng hết gói", name: days, widget: number, value_type: int, required: false, hint: "CRM dùng để nhắc sale gọi khách trước khi dùng hết (ví dụ 10)." }
      - { label: "Giảm thêm khi đặt trên web (%)", name: web_discount, widget: number, value_type: int, min: 0, max: 90, required: false, hint: "Thường để trống (= không giảm thêm, vì giá gói đã là giá ưu đãi)." }
      - { label: "Nhãn nhỏ trên tiêu đề", name: eyebrow, i18n: true, widget: string, required: false, hint: "Thẻ gói ở trang chủ. Ví dụ: Gói khởi động. Có ô Tiêu đề lớn thì thẻ gói dùng bố cục mới (lợi ích, nút lớn)." }
      - { label: "Tiêu đề lớn (trang chủ)", name: headline, i18n: true, widget: string, required: false, hint: "Ví dụ: 10 Ngày Sống Lành" }
      - { label: "Câu chính", name: tagline, i18n: true, widget: string, required: false, hint: "Ví dụ: Không cần thay đổi tất cả. Chỉ cần 10 ngày để bắt đầu." }
      - { label: "Câu phụ", name: subline, i18n: true, widget: string, required: false, hint: "Ví dụ: 3 sản phẩm – 3 thói quen nhỏ – 1 khởi đầu dễ dàng hơn." }
      - { label: "Chữ trên nút mua", name: cta, i18n: true, widget: string, required: false, hint: "Ví dụ: Bắt đầu 10 ngày Sống Lành. Để trống = Mua ngay." }
      - { label: "Chữ nút mua ngắn (thanh dưới đáy điện thoại)", name: cta_short, i18n: true, widget: string, required: false, hint: "Ví dụ: Bắt đầu ngay" }
      - { label: "Câu nhỏ dưới nút mua", name: cta_note, i18n: true, widget: string, required: false }
      - { label: "Link tài liệu lộ trình", name: roadmap_link, widget: string, required: false, hint: "CHỈ điền khi đã có tài liệu lộ trình thật gửi cho khách. Có link thì web tự hiện nhãn 🎁 Lộ trình đồng hành, dòng quyền lợi và nút Xem lộ trình." }
      - label: "Trang gói – Phần đầu (hero)"
        name: hero
        i18n: true
        widget: object
        required: false
        collapsed: true
        hint: "Có phần này thì trang gói dùng bố cục thuyết phục: hero → vấn đề → giải pháp → 10 ngày → nhận được gì → nút cuối. Xuống dòng = ngắt dòng trên web."
        fields:
          - { label: "Nhãn nhỏ", name: eyebrow, i18n: true, widget: string, required: false }
          - { label: "Tiêu đề (H1)", name: title, i18n: true, widget: text, required: false }
          - { label: "Câu dẫn", name: sub, i18n: true, widget: text, required: false }
          - { label: "Mô tả", name: desc, i18n: true, widget: text, required: false }
      - label: "Trang gói – Chạm đúng vấn đề"
        name: pains
        i18n: true
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: "Tiêu đề", name: title, i18n: true, widget: string, required: false }
          - { label: "Các vấn đề", name: items, i18n: true, widget: list, required: false, field: { label: "Dòng", name: item, i18n: true, widget: string } }
          - { label: "Đoạn nổi bật", name: callout, i18n: true, widget: text, required: false }
      - label: "Trang gói – Giới thiệu giải pháp"
        name: solution
        i18n: true
        widget: object
        required: false
        collapsed: true
        hint: "Các thẻ giải pháp lấy từ ô Lợi ích / Mô tả / Thông điệp của từng sản phẩm trong gói."
        fields:
          - { label: "Tiêu đề", name: title, i18n: true, widget: text, required: false }
          - { label: "Đoạn mở đầu", name: intro, i18n: true, widget: text, required: false }
      - label: "Trang gói – Các chặng (Cách trải nghiệm)"
        name: journey
        i18n: true
        widget: object
        required: false
        collapsed: true
        hint: "Nút Xem cách trải nghiệm ở trang chủ dẫn tới phần này."
        fields:
          - { label: "Tiêu đề", name: title, i18n: true, widget: string, required: false }
          - { label: "Câu phụ", name: sub, i18n: true, widget: string, required: false }
          - label: "Các chặng"
            name: steps
            i18n: true
            widget: list
            required: false
            summary: "{{fields.label}}"
            fields:
              - { label: "Nhãn", name: label, i18n: true, widget: string, hint: "Ví dụ: Ngày 1 – 3" }
              - { label: "Nội dung", name: text, i18n: true, widget: string }
          - { label: "Câu trích dẫn", name: quote, i18n: true, widget: text, required: false }
      - label: "Trang gói – Bạn nhận được gì"
        name: receive
        i18n: true
        widget: object
        required: false
        collapsed: true
        hint: "Web tự liệt kê sản phẩm trong gói + Miễn phí vận chuyển. Chỉ thêm quyền lợi khách THẬT SỰ nhận được."
        fields:
          - { label: "Tiêu đề", name: title, i18n: true, widget: text, required: false }
          - { label: "Quyền lợi thêm", name: extras, i18n: true, widget: list, required: false, field: { label: "Dòng", name: item, i18n: true, widget: string } }
      - label: "Trang gói – Khối giá & nút cuối trang"
        name: final
        i18n: true
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: "Tiêu đề", name: title, i18n: true, widget: text, required: false }
          - { label: "Câu phụ", name: sub, i18n: true, widget: string, required: false }
          - { label: "Câu nhỏ dưới nút", name: note, i18n: true, widget: string, required: false }
      - label: "Ảnh gói"
        name: images
        widget: list
        hint: "Ảnh đầu tiên là ảnh đại diện (vuông ≥1000px)."
        field: { label: "Ảnh", name: image, widget: image }
      - { label: "Mô tả ngắn (cạnh giá)", name: summary, i18n: true, widget: markdown, buttons: [bold, italic, link] }
      - label: "Nhu cầu"
        name: needs
        widget: relation
        collection: settings
        file: needs
        value_field: "needs.*.slug"
        search_fields: ["needs.*.name"]
        display_fields: ["needs.*.name"]
        multiple: true
        required: false
        hint: "Sản phẩm hiện ở các thẻ “Chọn theo nhu cầu” nào."
      - label: "Đánh giá khách hàng (chỉ nhập đánh giá thật)"
        name: reviews
        i18n: true
        widget: list
        required: false
        summary: "{{fields.name}} – {{fields.rating}}★"
        hint: "Hiện ở khối “Khách hàng nói gì” trên trang sản phẩm. Từ 3 đánh giá có chấm sao trở lên, web mới hiện sao trung bình trên thẻ sản phẩm và gửi cho Google. Không tự tạo đánh giá."
        fields:
          - { label: "Tên khách", name: name, widget: string, hint: "Có thể viết tắt: Chị Lan" }
          - { label: "Nơi ở / nghề nghiệp", name: location, i18n: true, widget: string, required: false }
          - { label: "Số sao (1–5)", name: rating, widget: number, value_type: int, min: 1, max: 5, required: false }
          - { label: "Lời nhận xét", name: text, i18n: true, widget: text, required: false }
          - { label: "Ảnh (ảnh chụp tin nhắn / ảnh khách gửi)", name: img, widget: image, required: false, hint: "Có video thì ảnh này làm ảnh bìa video." }
          - { label: "Video (link YouTube hoặc file .mp4)", name: video, widget: string, required: false }
      - label: "Từ khóa tìm kiếm (không hiện ra web)"
        name: keywords
        i18n: true
        widget: list
        required: false
        hint: "Khách gõ các từ này (có dấu hay không dấu đều được) sẽ tìm ra sản phẩm. Ví dụ: ăn sáng, bữa phụ, ăn chay. Từ đứng trước ưu tiên hơn. Chỉ dùng để tìm, không hiện ra web."
        field: { label: "Từ khóa", name: keyword, i18n: true, widget: string }
      - label: "Điểm nổi bật (dấu tích xanh)"
        name: highlights
        i18n: true
        widget: list
        required: false
        field: { label: "Điểm nổi bật", name: text, i18n: true, widget: string }
      - label: "Các mục mô tả chi tiết"
        name: sections
        i18n: true
        widget: list
        required: false
        summary: "{{fields.title}}"
        hint: "Ví dụ: Lịch dùng 10 ngày, Phù hợp với ai, Lưu ý. Chỉ mô tả thói quen, thực đơn – không hứa kết quả sức khỏe."
        fields:
          - { label: "Tiêu đề mục", name: title, i18n: true, widget: string }
          - label: "Kiểu trình bày"
            name: style
            widget: select
            default: box
            options:
              - { label: "Đoạn văn trong khung xám", value: box }
              - { label: "Đoạn văn có viền xanh bên trái", value: quote }
              - { label: "Danh sách gạch đầu dòng", value: list }
          - { label: "Nội dung (khi chọn Đoạn văn)", name: text, i18n: true, widget: markdown, required: false }
          - label: "Các dòng (khi chọn Danh sách)"
            name: items
            i18n: true
            widget: list
            required: false
            field: { label: "Dòng", name: item, i18n: true, widget: string }
      - { label: "Dòng lưu ý cuối trang", name: disclaimer, i18n: true, widget: text, required: false, hint: "Gói có thực phẩm bổ sung thì phải có câu: Sản phẩm này không phải là thuốc và không có tác dụng thay thế thuốc chữa bệnh." }

  # ------------------------------------------------------------ TRANG CHÍNH SÁCH
  - name: pages
    label: "Trang chính sách / hỗ trợ"
    label_singular: "trang"
    folder: content/pages
    i18n: true
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    sortable_fields: [order, title]
