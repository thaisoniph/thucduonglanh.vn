# Cấu hình trang quản trị https://thucduonglanh.vn/admin/ (Sveltia CMS)
backend:
  name: github
  repo: thaisoniph/thucduonglanh.vn
  branch: main
  commit_messages:
    create: "Thêm {{collection}}: {{slug}}"
    update: "Cập nhật {{collection}}: {{slug}}"
    delete: "Xoá {{collection}}: {{slug}}"
    uploadMedia: "Tải ảnh {{path}}"
    deleteMedia: "Xoá ảnh {{path}}"

site_url: https://thucduonglanh.vn
display_url: https://thucduonglanh.vn
logo_url: /assets/img/brand/icon-180.png
media_folder: assets/uploads
public_folder: /assets/uploads

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  # ------------------------------------------------------------ BÀI VIẾT
  - name: posts
    label: "Bài viết (Góc Sống Lành)"
    label_singular: "bài viết"
    description: "Bài viết hiển thị ở mục Góc Sống Lành. Bấm “Xuất bản” – khoảng 2 phút sau bài xuất hiện trên web."
    folder: content/posts
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} ({{date}})"
    sortable_fields: [date, title]
    preview_path: "goc-song-lanh/{{slug}}/"
    fields:
      - { label: "Tiêu đề bài viết", name: title, widget: string }
      - { label: "Ngày đăng", name: date, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - label: "Chuyên mục"
        name: category
        widget: relation
        collection: settings
        file: post_categories
        value_field: "categories.*.slug"
        search_fields: ["categories.*.name"]
        display_fields: ["categories.*.name"]
      - { label: "Ảnh đại diện", name: image, widget: image, hint: "Ảnh vuông hoặc ngang, tối thiểu 1000px. Web tự nén ảnh." }
      - { label: "Mô tả ngắn", name: excerpt, widget: text, hint: "1–2 câu, hiện ở danh sách bài và khi chia sẻ Facebook/Zalo." }
      - { label: "Hiển thị trên web", name: published, widget: boolean, default: true, hint: "Tắt để ẩn bài mà không xoá." }
      - { label: "Nội dung", name: body, widget: markdown }

  # ------------------------------------------------------------ SẢN PHẨM
  - name: products
    label: "Sản phẩm"
    label_singular: "sản phẩm"
    description: "Thông tin, giá, ảnh và mô tả sản phẩm. Giá nhập bằng số, ví dụ 140000."
    folder: content/products
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}}"
    sortable_fields: [order, name]
    preview_path: "san-pham/{{slug}}/"
    fields:
      - { label: "Tên sản phẩm", name: name, widget: string }
      - { label: "Tên ngắn", name: short_name, widget: string, required: false, hint: "Dùng ở nút tư vấn nổi, ví dụ: Trà DILVANG" }
      - label: "Danh mục"
        name: category
        widget: relation
        collection: settings
        file: categories
        value_field: "categories.*.slug"
        search_fields: ["categories.*.name"]
        display_fields: ["categories.*.name"]
      - { label: "Hiển thị trên web", name: published, widget: boolean, default: true, hint: "Tắt để tạm ẩn sản phẩm (hết hàng, ngừng bán)." }
      - { label: "Sản phẩm nổi bật", name: featured, widget: boolean, default: false, hint: "Hiện ở mục “Sản phẩm được yêu thích nhất” trên trang chủ." }
      - { label: "Thứ tự hiển thị", name: order, widget: number, value_type: int, default: 50, hint: "Số nhỏ đứng trước." }
      - { label: "Nhãn trên ảnh", name: badge, widget: string, required: false, hint: "Ví dụ: Bán chạy, Mới, Thuần chay. Để trống nếu không cần." }
      - { label: "Mã SKU", name: sku, widget: string, required: false }
      - { label: "Giá bán (đồng)", name: price, widget: number, value_type: int, required: false, hint: "Để trống = hiện “Liên hệ”. Nếu có nhiều quy cách thì nhập giá ở phần Quy cách bên dưới." }
      - { label: "Giá gốc gạch ngang (đồng)", name: regular_price, widget: number, value_type: int, required: false, hint: "Chỉ nhập khi đang giảm giá, phải lớn hơn Giá bán." }
      - { label: "Giảm khi đặt trên web (%)", name: web_discount, widget: number, value_type: int, min: 0, max: 90, required: false, hint: "Để trống = theo mức chung trong Cài đặt → Ưu đãi chỉ có khi đặt trên website. Nhập 0 = không giảm (sản phẩm giá thấp, lãi mỏng). Áp dụng cho mọi quy cách, trừ quy cách có ô riêng." }
      - { label: "Quy cách (1 loại)", name: unit, widget: string, required: false, hint: "Ví dụ: Chai 500ml. Bỏ qua nếu dùng nhiều quy cách." }
      - label: "Nhiều quy cách / nhiều giá"
        name: variants
        widget: list
        required: false
        summary: "{{fields.name}} – {{fields.price}}đ"
        hint: "Ví dụ: Hộp 400g – 450000, Hộp 125g – 140000. Loại đầu tiên được chọn sẵn."
        fields:
          - { label: "Tên quy cách", name: name, widget: string }
          - { label: "Giá bán (đồng)", name: price, widget: number, value_type: int, required: false }
          - { label: "Giá gốc gạch ngang (đồng)", name: regular_price, widget: number, value_type: int, required: false }
          - { label: "Giảm khi đặt trên web (%) – riêng quy cách này", name: web_discount, widget: number, value_type: int, min: 0, max: 90, required: false, hint: "Để trống = theo mức của sản phẩm. Nhập 0 = quy cách này không giảm." }
          - { label: "Số gói/phần trong quy cách này", name: servings, widget: number, value_type: int, required: false, hint: "Ví dụ hộp 20 gói → 20. Web hiện “≈ 22.500đ/gói”. Để trống = không hiện." }
      - label: "Ảnh sản phẩm"
        name: images
        widget: list
        hint: "Ảnh đầu tiên là ảnh đại diện. Nên dùng ảnh vuông ≥1000px. Web tự nén ảnh."
        field: { label: "Ảnh", name: image, widget: image }
      - { label: "Mô tả ngắn (cạnh giá)", name: summary, widget: markdown, buttons: [bold, italic, link] }
      - { label: "Số gói/phần (sản phẩm 1 quy cách)", name: servings, widget: number, value_type: int, required: false, hint: "Ví dụ hộp 15 gói → 15. Có nhiều quy cách thì nhập ở từng quy cách." }
      - { label: "Đơn vị phần", name: serving_unit, widget: string, required: false, hint: "Chữ sau giá mỗi phần: gói, bữa, ly… Để trống = phần." }
      - label: "Huy hiệu chứng nhận (dưới mô tả ngắn)"
        name: badges
        widget: list
        required: false
        hint: "Chỉ ghi điều có giấy tờ thật, ví dụ: Kiểm nghiệm NIFC, GMP – ISO 22000:2018. Huy hiệu có chữ “kiểm nghiệm” bấm vào sẽ tới mục Tiêu chuẩn & kiểm nghiệm."
        field: { label: "Huy hiệu", name: badge, widget: string }
      - { label: "Ảnh phiếu kiểm nghiệm", name: test_cert_img, widget: image, required: false, hint: "Có ảnh thì bấm huy hiệu Kiểm nghiệm sẽ mở ảnh này." }
      - label: "Nhu cầu"
        name: needs
        widget: relation
        collection: settings
        file: needs
        value_field: "needs.*.slug"
        search_fields: ["needs.*.name"]
        display_fields: ["needs.*.name"]
        multiple: true
        required: false
        hint: "Sản phẩm hiện ở các thẻ “Chọn theo nhu cầu” nào."
      - label: "Từ khóa tìm kiếm (không hiện ra web)"
        name: keywords
        widget: list
        required: false
        hint: "Khách gõ các từ này (có dấu hay không dấu đều được) sẽ tìm ra sản phẩm. Ví dụ: ăn sáng, bữa phụ, ăn chay. Từ đứng trước ưu tiên hơn. Chỉ dùng để tìm, không hiện ra web."
        field: { label: "Từ khóa", name: keyword, widget: string }
      - label: "Điểm nổi bật (dấu tích xanh)"
        name: highlights
        widget: list
        required: false
        field: { label: "Điểm nổi bật", name: text, widget: string }
      - label: "Các mục mô tả chi tiết"
        name: sections
        widget: list
        required: false
        summary: "{{fields.title}}"
        hint: "Mỗi mục là 1 khối: Thành phần, Công dụng, Cách dùng, Bảo quản…"
        fields:
          - { label: "Tiêu đề mục", name: title, widget: string }
          - label: "Kiểu trình bày"
            name: style
            widget: select
            default: box
            options:
              - { label: "Đoạn văn trong khung xám", value: box }
              - { label: "Đoạn văn có viền xanh bên trái", value: quote }
              - { label: "Danh sách gạch đầu dòng", value: list }
              - { label: "Bảng thông số (2 cột)", value: table }
          - { label: "Nội dung (khi chọn Đoạn văn)", name: text, widget: markdown, required: false }
          - label: "Các dòng (khi chọn Danh sách)"
            name: items
            widget: list
            required: false
            field: { label: "Dòng", name: item, widget: string }
          - label: "Các dòng bảng (khi chọn Bảng)"
            name: rows
            widget: list
            required: false
            summary: "{{fields.label}}: {{fields.value}}"
            fields:
              - { label: "Tên", name: label, widget: string }
              - { label: "Giá trị", name: value, widget: string }
      - label: "Gợi ý mua kèm"
        name: upsell
        widget: relation
        collection: products
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
        multiple: true
        required: false
        hint: "Sản phẩm ưu tiên gợi ý khi khách mua sản phẩm này. Để trống thì web tự gợi ý món giúp đơn đạt mức miễn phí vận chuyển."
      - { label: "Dòng lưu ý cuối trang", name: disclaimer, widget: text, required: false, hint: "Ví dụ: Sản phẩm này không phải là thuốc và không có tác dụng thay thế thuốc chữa bệnh." }

  # ------------------------------------------------------------ GÓI GIẢI PHÁP (COMBO)
  - name: combos
    label: "Gói giải pháp"
    label_singular: "gói"
    description: "Combo nhiều sản phẩm bán theo 1 giá (ví dụ Gói Khởi Động 10 Ngày Sống Lành). Web tự hiện ở trang chủ, danh mục Gói Giải Pháp, và gợi ý ở trang các sản phẩm có trong gói."
    folder: content/combos
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}} – {{price}}đ"
    sortable_fields: [order, name]
    preview_path: "san-pham/{{slug}}/"
    fields:
      - { label: "Tên gói", name: name, widget: string, hint: "Ví dụ: Gói Khởi Động 10 Ngày Sống Lành. Tên đầy đủ dùng trong giỏ hàng, đơn hàng, CRM." }
      - { label: "Tên ngắn", name: short_name, widget: string, required: false }
      - { label: "Hiển thị trên web", name: published, widget: boolean, default: true }
      - { label: "Nổi bật (hiện ở hộp tư vấn)", name: featured, widget: boolean, default: true }
      - { label: "Thứ tự hiển thị", name: order, widget: number, value_type: int, default: 1, hint: "Số nhỏ đứng trước." }
      - { label: "Nhãn trên ảnh", name: badge, widget: string, required: false, default: "Gói giải pháp" }
      - label: "Sản phẩm trong gói"
        name: items
        widget: list
        summary: "{{fields.qty}} × {{fields.product}} {{fields.variant}}"
        hint: "Chọn từng sản phẩm, gõ đúng tên quy cách (ví dụ: Hộp 125g). Sản phẩm 1 quy cách thì để trống ô quy cách. Web tự cộng giá gốc để hiện số tiền tiết kiệm."
        fields:
          - { label: "Sản phẩm", name: product, widget: relation, collection: products, value_field: "{{slug}}", search_fields: [name], display_fields: [name] }
          - { label: "Quy cách", name: variant, widget: string, required: false, hint: "Ví dụ: Hộp 125g. Để trống = quy cách đầu tiên." }
          - { label: "Số lượng", name: qty, widget: number, value_type: int, default: 1, min: 1 }
          - { label: "Biểu tượng", name: icon, widget: string, required: false, hint: "1 emoji, ví dụ 🥣 🥛 🍵" }
          - { label: "Lợi ích (chữ to)", name: benefit, widget: string, required: false, hint: "Ví dụ: Ăn lành hơn. Có ô này thì sản phẩm hiện thành 1 lợi ích ở thẻ gói trang chủ và trang gói." }
          - { label: "Tên hiển thị (chữ nhỏ)", name: title, widget: string, required: false, hint: "Ví dụ: Trà DILVANG. Để trống = tên sản phẩm." }
          - { label: "Câu ngắn (trang chủ)", name: note, widget: string, required: false }
          - { label: "Mô tả (trang gói)", name: detail, widget: text, required: false }
          - { label: "Thông điệp ngắn (trang gói)", name: quote, widget: string, required: false }
      - { label: "Giá gói (đồng)", name: price, widget: number, value_type: int, hint: "Nên thấp hơn tổng giá mua lẻ trên web (đã giảm %) để khách thấy lợi khi mua gói. Web hiện cả 2 mức tiết kiệm." }
      - { label: "Miễn phí vận chuyển", name: free_ship, widget: boolean, default: true, hint: "Bật: đơn có gói này được miễn phí ship." }
      - { label: "Số ngày dùng hết gói", name: days, widget: number, value_type: int, required: false, hint: "CRM dùng để nhắc sale gọi khách trước khi dùng hết (ví dụ 10)." }
      - { label: "Giảm thêm khi đặt trên web (%)", name: web_discount, widget: number, value_type: int, min: 0, max: 90, required: false, hint: "Thường để trống (= không giảm thêm, vì giá gói đã là giá ưu đãi)." }
      - { label: "Nhãn nhỏ trên tiêu đề", name: eyebrow, widget: string, required: false, hint: "Thẻ gói ở trang chủ. Ví dụ: Gói khởi động. Có ô Tiêu đề lớn thì thẻ gói dùng bố cục mới (lợi ích, nút lớn)." }
      - { label: "Tiêu đề lớn (trang chủ)", name: headline, widget: string, required: false, hint: "Ví dụ: 10 Ngày Sống Lành" }
      - { label: "Câu chính", name: tagline, widget: string, required: false, hint: "Ví dụ: Không cần thay đổi tất cả. Chỉ cần 10 ngày để bắt đầu." }
      - { label: "Câu phụ", name: subline, widget: string, required: false, hint: "Ví dụ: 3 sản phẩm – 3 thói quen nhỏ – 1 khởi đầu dễ dàng hơn." }
      - { label: "Chữ trên nút mua", name: cta, widget: string, required: false, hint: "Ví dụ: Bắt đầu 10 ngày Sống Lành. Để trống = Mua ngay." }
      - { label: "Chữ nút mua ngắn (thanh dưới đáy điện thoại)", name: cta_short, widget: string, required: false, hint: "Ví dụ: Bắt đầu ngay" }
      - { label: "Câu nhỏ dưới nút mua", name: cta_note, widget: string, required: false }
      - { label: "Link tài liệu lộ trình", name: roadmap_link, widget: string, required: false, hint: "CHỈ điền khi đã có tài liệu lộ trình thật gửi cho khách. Có link thì web tự hiện nhãn 🎁 Lộ trình đồng hành, dòng quyền lợi và nút Xem lộ trình." }
      - label: "Trang gói – Phần đầu (hero)"
        name: hero
        widget: object
        required: false
        collapsed: true
        hint: "Có phần này thì trang gói dùng bố cục thuyết phục: hero → vấn đề → giải pháp → 10 ngày → nhận được gì → nút cuối. Xuống dòng = ngắt dòng trên web."
        fields:
          - { label: "Nhãn nhỏ", name: eyebrow, widget: string, required: false }
          - { label: "Tiêu đề (H1)", name: title, widget: text, required: false }
          - { label: "Câu dẫn", name: sub, widget: text, required: false }
          - { label: "Mô tả", name: desc, widget: text, required: false }
      - label: "Trang gói – Chạm đúng vấn đề"
        name: pains
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: "Tiêu đề", name: title, widget: string, required: false }
          - { label: "Các vấn đề", name: items, widget: list, required: false, field: { label: "Dòng", name: item, widget: string } }
          - { label: "Đoạn nổi bật", name: callout, widget: text, required: false }
      - label: "Trang gói – Giới thiệu giải pháp"
        name: solution
        widget: object
        required: false
        collapsed: true
        hint: "Các thẻ giải pháp lấy từ ô Lợi ích / Mô tả / Thông điệp của từng sản phẩm trong gói."
        fields:
          - { label: "Tiêu đề", name: title, widget: text, required: false }
          - { label: "Đoạn mở đầu", name: intro, widget: text, required: false }
      - label: "Trang gói – Các chặng (Cách trải nghiệm)"
        name: journey
        widget: object
        required: false
        collapsed: true
        hint: "Nút Xem cách trải nghiệm ở trang chủ dẫn tới phần này."
        fields:
          - { label: "Tiêu đề", name: title, widget: string, required: false }
          - { label: "Câu phụ", name: sub, widget: string, required: false }
          - label: "Các chặng"
            name: steps
            widget: list
            required: false
            summary: "{{fields.label}}"
            fields:
              - { label: "Nhãn", name: label, widget: string, hint: "Ví dụ: Ngày 1 – 3" }
              - { label: "Nội dung", name: text, widget: string }
          - { label: "Câu trích dẫn", name: quote, widget: text, required: false }
      - label: "Trang gói – Bạn nhận được gì"
        name: receive
        widget: object
        required: false
        collapsed: true
        hint: "Web tự liệt kê sản phẩm trong gói + Miễn phí vận chuyển. Chỉ thêm quyền lợi khách THẬT SỰ nhận được."
        fields:
          - { label: "Tiêu đề", name: title, widget: text, required: false }
          - { label: "Quyền lợi thêm", name: extras, widget: list, required: false, field: { label: "Dòng", name: item, widget: string } }
      - label: "Trang gói – Khối giá & nút cuối trang"
        name: final
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: "Tiêu đề", name: title, widget: text, required: false }
          - { label: "Câu phụ", name: sub, widget: string, required: false }
          - { label: "Câu nhỏ dưới nút", name: note, widget: string, required: false }
      - label: "Ảnh gói"
        name: images
        widget: list
        hint: "Ảnh đầu tiên là ảnh đại diện (vuông ≥1000px)."
        field: { label: "Ảnh", name: image, widget: image }
      - { label: "Mô tả ngắn (cạnh giá)", name: summary, widget: markdown, buttons: [bold, italic, link] }
      - label: "Nhu cầu"
        name: needs
        widget: relation
        collection: settings
        file: needs
        value_field: "needs.*.slug"
        search_fields: ["needs.*.name"]
        display_fields: ["needs.*.name"]
        multiple: true
        required: false
        hint: "Sản phẩm hiện ở các thẻ “Chọn theo nhu cầu” nào."
      - label: "Từ khóa tìm kiếm (không hiện ra web)"
        name: keywords
        widget: list
        required: false
        hint: "Khách gõ các từ này (có dấu hay không dấu đều được) sẽ tìm ra sản phẩm. Ví dụ: ăn sáng, bữa phụ, ăn chay. Từ đứng trước ưu tiên hơn. Chỉ dùng để tìm, không hiện ra web."
        field: { label: "Từ khóa", name: keyword, widget: string }
      - label: "Điểm nổi bật (dấu tích xanh)"
        name: highlights
        widget: list
        required: false
        field: { label: "Điểm nổi bật", name: text, widget: string }
      - label: "Các mục mô tả chi tiết"
        name: sections
        widget: list
        required: false
        summary: "{{fields.title}}"
        hint: "Ví dụ: Lịch dùng 10 ngày, Phù hợp với ai, Lưu ý. Chỉ mô tả thói quen, thực đơn – không hứa kết quả sức khỏe."
        fields:
          - { label: "Tiêu đề mục", name: title, widget: string }
          - label: "Kiểu trình bày"
            name: style
            widget: select
            default: box
            options:
              - { label: "Đoạn văn trong khung xám", value: box }
              - { label: "Đoạn văn có viền xanh bên trái", value: quote }
              - { label: "Danh sách gạch đầu dòng", value: list }
          - { label: "Nội dung (khi chọn Đoạn văn)", name: text, widget: markdown, required: false }
          - label: "Các dòng (khi chọn Danh sách)"
            name: items
            widget: list
            required: false
            field: { label: "Dòng", name: item, widget: string }
      - { label: "Dòng lưu ý cuối trang", name: disclaimer, widget: text, required: false, hint: "Gói có thực phẩm bổ sung thì phải có câu: Sản phẩm này không phải là thuốc và không có tác dụng thay thế thuốc chữa bệnh." }

  # ------------------------------------------------------------ TRANG CHÍNH SÁCH
  - name: pages
    label: "Trang chính sách / hỗ trợ"
    label_singular: "trang"
    folder: content/pages
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    sortable_fields: [order, title]
    preview_path: "{{slug}}/"
    fields:
      - { label: "Tiêu đề", name: title, widget: string }
      - { label: "Thứ tự ở chân trang", name: order, widget: number, value_type: int, default: 50 }
      - { label: "Nội dung", name: body, widget: markdown, hint: "Có thể dùng {brand}, {hotline}, {email}, {address}, {company} – web tự thay bằng thông tin công ty." }

  # ------------------------------------------------------------ HƯỚNG DẪN NỘI BỘ (crm.thucduonglanh.vn/huong-dan/)
  - name: guide
    label: "Hướng dẫn nội bộ"
    label_singular: "phần hướng dẫn"
    description: "Trang hướng dẫn cho nhân sự tại crm.thucduonglanh.vn/huong-dan. Bấm Lưu, khoảng 2 phút sau trang được cập nhật."
    folder: guide
    extension: md
    format: frontmatter
    create: true
    delete: false
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{nav}} – {{title}}"
    sortable_fields: [order, title]
    media_folder: /guide/img
    public_folder: /huong-dan/img
    fields:
      - { label: "Tiêu đề trang", name: title, widget: string }
      - { label: "Tên trên thanh menu", name: nav, widget: string, hint: "Ngắn, 1–2 chữ. Ví dụ: CRM, Website." }
      - { label: "Thứ tự trên menu", name: order, widget: number, value_type: int, default: 50 }
      - { label: "Ngày cập nhật", name: updated, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { label: "Mô tả ngắn dưới tiêu đề", name: description, widget: string, required: false }
      - { label: "Ẩn khỏi thanh menu", name: hidden, widget: boolean, required: false, default: false, hint: "Bật = trang riêng, chỉ ai có link mới mở được (vd hướng dẫn riêng cho 1 nhân sự)." }
      - { label: "Nội dung", name: body, widget: markdown, hint: "Mỗi tiêu đề lớn (Heading 2) tự thành 1 mục trong phần “Trong trang này”. Ảnh chụp màn hình nên che tên, số điện thoại khách thật." }

  # ------------------------------------------------------------ CÀI ĐẶT
  - name: settings
    label: "Cài đặt website"
    editor: { preview: false }
    files:
      - name: site
        label: "Thông tin liên hệ, mạng xã hội, ngân hàng"
        file: data/site.json
        format: json
        fields:
          - { label: "Slogan", name: slogan, widget: string }
          - { label: "Câu giới thiệu ngắn (tiêu đề trang chủ)", name: tagline, widget: string }
          - { label: "Tên công ty", name: company, widget: string }
          - { label: "Mã số doanh nghiệp", name: tax_code, widget: string }
          - { label: "Ngày cấp", name: tax_date, widget: string }
          - { label: "Hotline", name: hotline, widget: string }
          - { label: "Hotline 2", name: hotline2, widget: string, required: false }
          - { label: "Số Zalo tư vấn (viết liền)", name: zalo, widget: string }
          - { label: "Email", name: email, widget: string }
          - { label: "Địa chỉ", name: address, widget: string }
          - { label: "Giờ làm việc", name: opening_hours, widget: string }
          - label: "Mạng xã hội (chân trang)"
            name: socials
            widget: object
            fields:
              - { label: "Shopee", name: shopee, widget: string, required: false }
              - { label: "Facebook", name: facebook, widget: string, required: false }
              - { label: "TikTok", name: tiktok, widget: string, required: false }
              - { label: "YouTube", name: youtube, widget: string, required: false }
              - { label: "TikTok Shop", name: tiktok_shop, widget: string, required: false }
              - { label: "Lazada", name: lazada, widget: string, required: false }
          - { label: "Link Zalo OA", name: zalo_oa, widget: string, required: false }
          - { label: "Link nhóm cộng đồng (góc trên cùng)", name: community_group, widget: string, required: false }
          - label: "Video thương hiệu (trang chủ + Giới thiệu)"
            name: brand_video
            widget: object
            required: false
            fields:
              - { label: "Link YouTube", name: youtube, widget: string, required: false, hint: "Dán link video YouTube. Để trống thì ẩn khối video." }
              - { label: "Tiêu đề", name: title, widget: string }
              - { label: "Mô tả ngắn", name: caption, widget: text, required: false }
              - { label: "Ảnh bìa", name: image, widget: image, required: false, hint: "Để trống thì dùng ảnh bìa của YouTube." }
              - { label: "Ngày đăng video (YYYY-MM-DD)", name: upload_date, widget: string, required: false }
              - { label: "Thời lượng (ví dụ PT2M9S = 2 phút 9 giây)", name: duration, widget: string, required: false }
          - label: "Ưu đãi chỉ có khi đặt trên website"
            name: web_offer
            widget: object
            required: false
            hint: "Giá trong từng sản phẩm vẫn nhập GIÁ GỐC. Web tự giảm theo % dưới đây, gạch giá gốc và hiện nhãn -%. CRM (đơn gọi điện/Zalo) vẫn dùng giá gốc."
            fields:
              - { label: "Bật giảm giá trên web", name: enabled, widget: boolean, default: true }
              - { label: "Mức giảm chung (%)", name: percent, widget: number, value_type: int, min: 0, max: 90, default: 15, hint: "Áp dụng cho sản phẩm để trống ô \"Giảm khi đặt trên web (%)\". Muốn giảm khác nhau thì vào từng Sản phẩm để nhập." }
              - { label: "Cộng dồn với sản phẩm đang có giá khuyến mãi riêng", name: stack_sale, widget: boolean, default: false, hint: "Tắt: sản phẩm đang có giá khuyến mãi riêng thì giữ giá khuyến mãi đó, không giảm thêm." }
              - { label: "Tiêu đề khung ưu đãi", name: label, widget: string, default: "Ưu đãi chỉ có khi đặt tại website" }
              - { label: "Câu quảng bá chính (dòng trên cùng + khung ưu đãi)", name: headline, widget: string, required: false, hint: "Ví dụ: Giá tại website luôn tốt hơn mua trên sàn. Để trống thì hiện “Giảm đến X% khi đặt trên web”." }
              - { label: "Câu quảng bá bản ngắn (điện thoại)", name: headline_short, widget: string, required: false, hint: "Tối đa khoảng 25 ký tự, ví dụ: Giá web tốt hơn trên sàn" }
              - { label: "Bật quà tặng", name: gift_enabled, widget: boolean, default: true }
              - { label: "Tên quà tặng", name: gift_title, widget: string, required: false }
              - { label: "Trị giá quà", name: gift_value, widget: string, required: false, hint: "Ví dụ: 999.000đ" }
              - { label: "Điều kiện nhận quà", name: gift_how, widget: string, required: false, hint: "Ví dụ: khi tham gia nhóm Zalo Cộng đồng Sống khỏe cùng Thực Dưỡng Lành" }
          - { label: "Link nhóm Zalo Sống khỏe", name: zalo_group, widget: string, required: false, hint: "Hiện trong menu điện thoại và trang Đặt hàng thành công. Để trống thì ẩn." }
          - label: "Ebook quà tặng (trang /ebook/ + lời mời ở trang chủ, cuối bài viết, hộp tư vấn, menu)"
            name: ebook
            widget: object
            required: false
            fields:
              - { label: "Link trang ebook", name: url, widget: string, required: false, hint: "Mặc định /ebook/ (trang nhận ebook trên web, số khách vào thẳng CRM). Để trống thì ẩn toàn bộ." }
              - { label: "Link đọc ebook (Heyzine)", name: flipbook, widget: string, required: false, hint: "Khách điền tên + SĐT ở trang /ebook/ xong sẽ được mở link này. Để trống thì không có trang /ebook/." }
              - { label: "Tiêu đề", name: title, widget: string }
              - { label: "Mô tả ngắn", name: sub, widget: text, required: false }
              - { label: "Chữ trên nút", name: button, widget: string, required: false }
              - { label: "Ảnh bìa ebook", name: image, widget: image, required: false }
          - label: "Các kênh cộng đồng (trang chủ)"
            name: community
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: "Tên kênh", name: name, widget: string }
              - { label: "Số liệu", name: stat, widget: string, required: false, hint: "Ví dụ: 98.000+ người theo dõi" }
              - { label: "Link", name: url, widget: string }
              - { label: "Ảnh", name: image, widget: image }
              - { label: "Mô tả", name: desc, widget: text }
          - label: "Tài khoản nhận chuyển khoản (mã QR)"
            name: bank
            widget: object
            fields:
              - { label: "Bật thanh toán chuyển khoản", name: enabled, widget: boolean }
              - { label: "Mã ngân hàng VietQR (VCB, TCB, MB, ACB…)", name: bank_id, widget: string }
              - { label: "Tên ngân hàng hiển thị", name: bank_name, widget: string }
              - { label: "Số tài khoản", name: account_no, widget: string }
              - { label: "Chủ tài khoản (không dấu)", name: account_name, widget: string }
          - { label: "Miễn phí ship cho đơn từ (đồng, 0 = không áp dụng)", name: free_ship_threshold, widget: number, value_type: int, default: 0 }
          - { label: "Phí ship cố định (đồng, 0 = báo khi xác nhận đơn)", name: shipping_fee, widget: number, value_type: int, default: 0 }

      - name: home
        label: "Trang chủ – Ảnh lớn đầu trang & băng chuyền"
        file: data/home.json
        format: json
        fields:
          - label: "Ảnh lớn đầu trang (cố định, không tự chạy)"
            name: hero
            widget: object
            fields:
              - { label: "Dòng nhỏ phía trên", name: eyebrow, widget: string, required: false }
              - { label: "Tiêu đề lớn", name: title, widget: string, hint: "Đặt chữ giữa hai dấu *sao* để hiện màu vàng nghiêng, ví dụ: Sống lành bắt đầu từ *10 ngày*" }
              - { label: "Câu dẫn", name: sub, widget: text, required: false }
              - { label: "Mã sản phẩm / gói khi bấm nút chính", name: product, widget: string, hint: "Phần cuối đường link sản phẩm, ví dụ thu-thach-10-ngay-song-lanh. Giá tự lấy theo sản phẩm." }
              - { label: "Chữ trên nút chính", name: cta, widget: string, hint: "Web tự thêm giá phía sau, ví dụ: Bắt đầu 10 ngày – 349.000đ" }
              - { label: "Ảnh (vuông)", name: image, widget: image }
          - label: "Băng chuyền sản phẩm (dưới Danh mục)"
            name: slides
            widget: list
            summary: "{{fields.title}}"
            fields:
              - label: "Sản phẩm khi bấm “Mua ngay”"
                name: product
                widget: relation
                collection: products
                value_field: "{{slug}}"
                search_fields: [name]
                display_fields: [name]
              - { label: "Dòng nhỏ phía trên", name: eyebrow, widget: string }
              - { label: "Tiêu đề", name: title, widget: string, hint: "Đặt chữ giữa hai dấu *sao* để hiện màu vàng nghiêng, ví dụ: Trà Hòa Tan *DILVANG*" }
              - { label: "Mô tả", name: subtitle, widget: text }
              - { label: "Ảnh (vuông)", name: image, widget: image }

      - name: brochure
        label: "Hồ sơ thương hiệu (brochure)"
        file: data/brochure.json
        format: json
        fields:
          - { label: "Tiêu đề", name: title, widget: string }
          - { label: "Câu trích dẫn", name: quote, widget: text }
          - { label: "Giới thiệu ngắn", name: intro, widget: text }
          - { label: "Link sách lật Heyzine", name: flipbook_url, widget: string, hint: "Khi có bản brochure mới trên Heyzine, dán link mới vào đây." }
          - { label: "File PDF để khách tải", name: pdf, widget: file, required: false }
          - { label: "Ảnh bìa", name: cover, widget: image }
          - { label: "Số trang", name: pages, widget: number, value_type: int }
          - label: "Các chương"
            name: chapters
            widget: list
            summary: "{{fields.no}}. {{fields.title}}"
            fields:
              - { label: "Số chương", name: no, widget: string }
              - { label: "Tên chương", name: title, widget: string }
              - { label: "Mô tả", name: desc, widget: string }
          - label: "Số liệu nổi bật"
            name: stats
            widget: list
            summary: "{{fields.value}} – {{fields.label}}"
            fields:
              - { label: "Con số", name: value, widget: string }
              - { label: "Ý nghĩa", name: label, widget: string }
          - { label: "Ghi chú số liệu", name: stats_note, widget: string, required: false }
          - { label: "Giải thưởng / ghi nhận", name: award, widget: string, required: false }
          - { label: "Ghi chú giải thưởng", name: award_note, widget: text, required: false }
      - name: categories
        label: "Danh mục sản phẩm"
        file: data/categories.json
        format: json
        fields:
          - label: "Danh mục"
            name: categories
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: "Tên danh mục", name: name, widget: string }
              - { label: "Mã (không dấu, dùng trên đường link)", name: slug, widget: string, hint: "Ví dụ: tra-thao-moc. Không đổi mã của danh mục đang có sản phẩm." }
              - { label: "Ảnh", name: image, widget: image }
              - { label: "Mô tả", name: desc, widget: text, required: false }

      - name: needs
        label: "Chọn theo nhu cầu"
        file: data/needs.json
        format: json
        fields:
          - label: "Nhu cầu"
            name: needs
            widget: list
            summary: "{{fields.icon}} {{fields.name}}"
            hint: "Thẻ ở trang chủ (dưới ảnh lớn) và trang danh sách sản phẩm. Gắn sản phẩm vào nhu cầu ở ô “Nhu cầu” của từng sản phẩm. Nhu cầu chỉ có 1 sản phẩm thì bấm vào là tới thẳng sản phẩm đó. Không ghi tên bệnh hay công dụng chữa bệnh."
            fields:
              - { label: "Tên nhu cầu", name: name, widget: string, hint: "Ví dụ: Bữa sáng bận rộn" }
              - { label: "Mã (không dấu, dùng trên đường link)", name: slug, widget: string, hint: "Ví dụ: bua-sang-ban-ron. Link: /nhu-cau/bua-sang-ban-ron/" }
              - { label: "Biểu tượng (emoji)", name: icon, widget: string, required: false }
              - { label: "Mô tả ngắn", name: desc, widget: string, required: false }

      - name: post_categories
        label: "Chuyên mục bài viết"
        file: data/post-categories.json
        format: json
        fields:
          - label: "Chuyên mục"
            name: categories
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: "Tên chuyên mục", name: name, widget: string }
              - { label: "Mã (không dấu)", name: slug, widget: string }
