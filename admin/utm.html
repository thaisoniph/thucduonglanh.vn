<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Tạo link theo dõi (UTM) – Thực Dưỡng Lành</title>
<style>body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f7f6f2;color:#262a1f;margin:0;padding:24px}main{max-width:720px;margin:0 auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 6px 24px rgba(0,0,0,.06)}h1{color:#1f5f3a;font-size:24px;margin:0 0 6px}p.s{color:#666;margin:0 0 18px}label{display:block;font-weight:600;margin:14px 0 6px}input,select{width:100%;box-sizing:border-box;font-size:16px;padding:12px;border:1.5px solid #d6d3c8;border-radius:10px}.out{margin-top:20px;background:#eaf3ec;border-radius:12px;padding:14px;word-break:break-all;font-size:15px}button{margin-top:12px;background:#1f5f3a;color:#fff;border:0;border-radius:999px;padding:12px 22px;font-size:16px;font-weight:600;cursor:pointer}small{color:#777}</style></head><body><main>
<h1>Tạo link theo dõi (UTM)</h1><p class="s">Dùng link này khi đăng bài/chạy quảng cáo để biết đơn hàng đến từ kênh nào (xem trong Google Analytics và cột "Nguồn" của Sheet đơn hàng).</p>
<label>Trang đích</label><input id="u" value="https://thucduonglanh.vn/" placeholder="https://thucduonglanh.vn/san-pham/...">
<label>Kênh (nguồn)</label><select id="s"><option value="facebook">Facebook</option><option value="tiktok">TikTok</option><option value="zalo">Zalo</option><option value="youtube">YouTube</option><option value="google">Google</option><option value="shopee">Shopee</option><option value="email">Email</option><option value="sms">SMS</option><option value="offline">Tờ rơi / QR in ấn</option></select>
<label>Hình thức</label><select id="m"><option value="post">Bài đăng miễn phí</option><option value="ads">Quảng cáo trả phí</option><option value="livestream">Livestream</option><option value="group">Nhóm cộng đồng</option><option value="message">Tin nhắn chăm sóc</option><option value="kol">KOL / cộng tác viên</option><option value="qr">Mã QR</option></select>
<label>Tên chiến dịch <small>(không dấu, ví dụ: trungthu2026, dilvang-combo)</small></label><input id="c" placeholder="trungthu2026">
<label>Nội dung / người đăng <small>(không bắt buộc, ví dụ: video-co-lan, ctv-hoa)</small></label><input id="n">
<div class="out" id="o"></div><button id="cp">📋 Sao chép link</button></main>
<script>
function slug(x){return x.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function gen(){var u=document.getElementById('u').value.trim()||'https://thucduonglanh.vn/';try{var url=new URL(u);}catch(e){document.getElementById('o').textContent='Link trang đích chưa đúng';return;}
url.searchParams.set('utm_source',document.getElementById('s').value);url.searchParams.set('utm_medium',document.getElementById('m').value);var c=slug(document.getElementById('c').value);if(c)url.searchParams.set('utm_campaign',c);var n=slug(document.getElementById('n').value);if(n)url.searchParams.set('utm_content',n);document.getElementById('o').textContent=url.toString();}
['u','s','m','c','n'].forEach(function(i){document.getElementById(i).addEventListener('input',gen);});gen();
document.getElementById('cp').onclick=function(){navigator.clipboard.writeText(document.getElementById('o').textContent).then(function(){document.getElementById('cp').textContent='✅ Đã sao chép';setTimeout(function(){document.getElementById('cp').textContent='📋 Sao chép link'},1500);});};
</script></body></html>
