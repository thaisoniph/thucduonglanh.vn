name: Website – dựng và đăng

# Website thucduonglanh.vn. Chỉ chạy khi đổi phần của website: sửa riêng CRM / api / Apps Script / tài liệu thì bỏ qua.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'crm/**'
      - 'guide/**'
      - 'api/**'
      - 'backend/**'
      - 'scripts/**'
      - 'output/**'
      - '.agent/**'
      - '.claude/**'
      - '*.md'
      - '.github/workflows/deploy-crm.yml'
      - '.github/workflows/deploy-api.yml'
      - '.github/workflows/apps-script.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py
      - name: Đăng lên Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=thucduonglanh --branch=main --commit-dirty=true
