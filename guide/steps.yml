      els:
        - ["chips", ["🗣 Lời khách", "👥 Nhóm khách", "⚙️ Cài đặt"], 1]
        - ["card", "Mẹ sau sinh", "🟢 Đang dùng · 6 nỗi lòng", ""]
        - ["card", "Con mua quà cho bố mẹ", "🟢 Đang dùng · 🌟 có ý lớn", ""]
        - ["btn", "✏️ Sửa", ""]
      hi: 3
      text: "Thẻ <b>👥 Nhóm khách</b> → bấm tên nhóm để mở → bấm <b>✏️ Sửa</b>."
    - title: Sửa nhóm khách
      els:
        - ["h", "🌟 Big idea và góc kể"]
        - ["btn", "✨ AI gợi ý big idea", "g"]
        - ["note", "Chờ khoảng 1 phút"]
        - ["in", "Ô big idea", "Bà vẫn đúng, mẹ vẫn được nghỉ"]
