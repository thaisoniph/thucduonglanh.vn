      text: "Kéo xuống ô <b>🌟 Big idea và góc kể</b>, bấm <b>✨ AI gợi ý big idea</b>. AI điền 3 ý lớn, mỗi ý 10 góc kể."
    - title: Sửa nhóm khách
      els:
        - ["card", "Bà vẫn đúng, mẹ vẫn được nghỉ", "- Kể từ người mẹ  - Lời bà dặn…", "g"]
        - ["note", "Giữ cái ưng nhất ở TRÊN CÙNG"]
        - ["note", "Cái để dành: cách 1 dòng trống"]
        - ["btn", "Lưu", "g"]
      hi: 3
      text: "<b>Giữ 1 ý ưng nhất ở trên cùng</b> (đó là ý đang chạy). Xoá hoặc để dành mấy ý còn lại. Bấm <b>Lưu</b>. Chạy 2–4 tuần rồi đổi."
ct-insight:
