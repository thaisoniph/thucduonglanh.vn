# Hướng dẫn từng bước bằng hình cho người bán hàng (Sale & CSKH). Gọi trong guide/*.md bằng 1 dòng riêng: [[steps:dang-nhap]]
# Sửa chữ trong "text" thoải mái (được dùng <b>). Sửa hình: els = các phần tử trong màn hình, hi = phần tử cần bấm (xem guide/steps.py).
dang-nhap:
  title: Đăng nhập CRM bằng mã email
  steps:
    - title: CRM Thực Dưỡng Lành
      els:
        - ["h", "Đăng nhập"]
        - ["in", "Email của bạn", "ban@gmail.com"]
        - ["btn", "Gửi mã đăng nhập", "g"]
        - ["note", "Không cần mật khẩu"]
      hi: 2
      text: "Mở <b>crm.thucduonglanh.vn</b> trên điện thoại. Gõ email của bạn rồi bấm <b>Gửi mã đăng nhập</b>."
    - title: Hộp thư email
      els:
        - ["h", "Hộp thư"]
        - ["card", "Thực Dưỡng Lành CRM", "Mã đăng nhập của bạn: 482915", "y"]
        - ["note", "Mã dùng được trong 10 phút"]
        - ["note", "Không thấy thư? Tìm trong Spam"]
      hi: 1
      text: "Mở hộp thư email, tìm thư có <b>mã 6 số</b>. Không thấy thì tìm trong mục <b>Spam</b> hoặc <b>Quảng cáo</b>."
    - title: CRM Thực Dưỡng Lành
      els:
        - ["h", "Nhập mã"]
        - ["in", "Mã 6 số trong email", "482915"]
        - ["note", "Gõ đủ 6 số là vào luôn"]
        - ["card", "Máy nhớ bạn 30 ngày", "Lần sau không cần gõ lại mã", "g"]
      hi: 1
      text: "Gõ <b>6 số</b> vào CRM. Gõ đủ 6 số là vào luôn. Máy nhớ bạn <b>30 ngày</b>."
goi-khach:
  title: Gọi khách ở tab Hôm nay
  steps:
    - title: Hôm nay
      tabs: sale
      act: 0
      els:
        - ["h", "Hôm nay còn 12 việc"]
        - ["btn", "▶ Bắt đầu: Chị Phương · xác nhận đơn", "g"]
        - ["chips", ["Tất cả 12", "Đơn mới 2", "Chăm sóc 8"], 0]
        - ["card", "Cô Lan · 📦 Hỏi nhận hàng", "📞 Gọi · 💬 Ghi lại", ""]
      hi: 1
      text: "Mở tab <b>Hôm nay</b>. Bấm nút xanh <b>▶ Bắt đầu</b>: CRM mở người cần gọi đầu tiên (đơn mới, khách vừa hỏi), tới khách chăm sóc thì mở lần lượt từng người."
    - title: Gọi khách
      els:
        - ["h", "Chị Lan · 0912 345 678"]
        - ["card", "Đã mua Trà DILVANG 2 hộp", "Lần trước: chị bảo ngủ ngon hơn", ""]
        - ["btn2", "📞 Gọi", "💬 Nhắn Zalo", "g"]
        - ["note", "Chưa biết nói gì? Xem 💬 Kịch bản gọi"]
      hi: 2
      text: "Đọc nhanh khách mua gì, lần trước nói gì. Bấm <b>📞 Gọi</b> hoặc <b>💬 Nhắn Zalo</b> (CRM chép sẵn tin nhắn)."
    - title: Ghi kết quả
      els:
        - ["in", "✍️ Khách nói gì?", "chị bảo còn 1 hộp"]
        - ["btn", "📵 Không nghe máy", ""]
        - ["btn", "👍 Dùng ok", ""]
        - ["btn", "🛒 Lên đơn ngay", "g"]
      hi: 1
      text: "Gõ vài chữ khách nói, rồi bấm <b>1 nút kết quả</b> (ví dụ <b>📵 Không nghe máy</b>). CRM tự nhắc gọi lại đúng ngày và mở khách tiếp theo. Khách muốn mua thì bấm <b>🛒 Lên đơn ngay</b>."
len-don:
  title: Lên đơn khi khách đặt hàng
  steps:
    - title: Đơn hàng
      tabs: sale
      act: 2
      els:
        - ["h", "Đơn hàng"]
        - ["btn", "＋ Tạo đơn", "g"]
        - ["card", "Phuong201026-01 · Chị Lan", "Đang giao · 1.800.000đ", ""]
      hi: 1
      text: "Khách đặt qua Zalo hoặc điện thoại thì bạn tạo đơn trên CRM. Vào tab <b>Đơn hàng</b>, bấm <b>＋ Tạo đơn</b>."
    - title: Tạo đơn
      els:
        - ["btn", "📋 Dán tin nhắn của khách", "g"]
        - ["in", "Tên khách", "Chị Lan"]
        - ["in", "Số điện thoại", "0912 345 678"]
        - ["note", "🆕 Địa chỉ mới 34 tỉnh · 🕰 Địa chỉ cũ"]
      hi: 0
      text: "Bấm <b>📋 Dán tin nhắn của khách</b>, dán nguyên tin Zalo (có tên, số điện thoại, địa chỉ). CRM tự điền các ô, bạn chỉ cần <b>xem lại</b>, nhất là 2 ô địa chỉ."
    - title: Tạo đơn
      els:
        - ["note", "Chọn sản phẩm"]
        - ["chips", ["Trà DILVANG", "Progomax", "Combo"], "0"]
        - ["in", "Số tiền thu của khách", "1tr8"]
        - ["chips", ["COD", "Chuyển khoản"], "0"]
      hi: 1
      text: "Bấm <b>tên sản phẩm</b> (bấm thêm để tăng số lượng). Gõ <b>số tiền thu</b> (gõ <b>1tr8</b> cũng được). Chọn <b>COD</b> hoặc <b>Chuyển khoản</b>."
    - title: Tạo đơn
      els:
        - ["card", "Mã đơn tự điền", "Phuong201026-01", "g"]
        - ["card", "💵 COD · 🚚 BEST Express", "Phí ship 30.000đ", ""]
        - ["btn", "Lưu & copy lên đơn", "g"]
        - ["note", "Nội dung đơn đã chép sẵn để dán"]
      hi: 2
      text: "Kiểm tra lại, rồi bấm <b>Lưu & copy lên đơn</b>. Đơn được lưu, nội dung đơn đã chép sẵn, bạn <b>dán sang bên vận chuyển</b>."
ma-van-don:
  title: Nhập mã vận đơn sau khi gửi hàng
  steps:
    - title: Đơn hàng
      tabs: sale
      act: 2
      els:
        - ["h", "Đơn hàng"]
        - ["card", "Phuong201026-01 · Chị Lan", "Đã xác nhận · 1.800.000đ", "g"]
        - ["btn", "📦 Nhập mã VĐ", "g"]
      hi: 2
      text: "Gửi hàng xong, mở tab <b>Đơn hàng</b>. Trên đơn đó bấm <b>📦 Nhập mã VĐ</b>."
    - title: Vận chuyển
      els:
        - ["h", "🚚 Vận chuyển"]
        - ["in", "Mã vận đơn (in trên phiếu gửi hàng)", "BE1234567890"]
        - ["btn", "Lưu vận đơn", "g"]
        - ["note", "Đơn tự chuyển sang Đang giao"]
      hi: 2
      text: "Gõ <b>mã vận đơn</b> (mã in trên phiếu gửi hàng), bấm <b>Lưu vận đơn</b>. Đơn tự chuyển sang <b>Đang giao</b>."
# ---------- Làm content theo khoá học (guide/content.md, 15/11/2026) – màn hình CRM → 🎯 Insight & nội dung
ct-mo:
  title: Mở màn hình 🎯 Insight & nội dung
  steps:
    - title: Marketing TDL
      els:
        - ["h", "Menu"]
        - ["card", "📣 Marketing", "Quảng cáo, chi phí, khách mới", ""]
        - ["card", "🎯 Insight & nội dung", "Nơi dạy trợ lý AI viết cho ai", "g"]
        - ["card", "📍 Link & QR", "Link theo dõi, mã QR", ""]
      hi: 2
      text: "Mở CRM. Bấm <b>🎯 Insight</b> trên menu. Không thấy thì bấm <b>••• Thêm</b> → <b>🎯 Insight & nội dung</b>."
    - title: Insight & nội dung
      els:
        - ["h", "🎯 Insight & nội dung"]
        - ["chips", ["1 Nhóm", "2 Nỗi lòng", "3 Loại bài", "4 Viết"], -1]
        - ["bar", "👉 Nên làm ngay: Tết sắp tới, lên ý lớn"]
        - ["btn", "Làm ngay", "g"]
        - ["note", "Không có việc gì thì ô báo ✅ mọi thứ ổn"]
      hi: 3
      text: "Trên cùng là 4 bước viết bài. Ngay dưới là ô cam <b>👉 Nên làm ngay</b> (tối đa 3 việc). Mỗi ngày chỉ cần nhìn ô này và <b>bấm nút trong ô</b>."
    - title: Insight & nội dung
      els:
        - ["chips", ["📊 Tổng quan", "✍️ Tạo", "🧪 Chấm"], 1]
        - ["chips", ["🗣 Lời khách", "🛡 Gác cổng", "👥 Nhóm"], -1]
        - ["chips", ["⚙️ Cài đặt"], -1]
        - ["card", "📌 Dùng để · 👉 Nên làm", "Đầu mỗi thẻ nói thẻ đó để làm gì", "g"]
      hi: 0
      text: "Bên dưới có <b>7 thẻ</b>. Bấm tên thẻ để chuyển. Đầu mỗi thẻ có ô xanh <b>📌 Dùng để · 👉 Nên làm</b>: đọc 2 dòng đó là biết thẻ để làm gì."
ct-video:
  title: Viết kịch bản video ngắn
  steps:
    - title: Insight & nội dung
      els:
        - ["chips", ["📊 Tổng quan", "✍️ Tạo nội dung", "🧪 Chấm"], 1]
        - ["h", "🎬 Viết kịch bản video ngắn"]
        - ["in", "🎯 Nhóm khách", "Mẹ sau sinh"]
        - ["in", "Loại bài", "AI tự chọn"]
        - ["in", "Độ dài", "45 giây"]
        - ["in", "Thể loại", "Tình huống"]
      hi: 2
      text: "Bấm thẻ <b>✍️ Tạo nội dung</b>. Ở ô <b>🎬 Viết kịch bản video ngắn</b>, chọn <b>nhóm khách</b>. Các ô khác để <b>AI tự chọn</b> cũng được."
    - title: Insight & nội dung
      els:
        - ["in", "Yêu cầu thêm (không bắt buộc)", "quay ở bếp, chị Lan nói"]
        - ["btn", "🎬 Viết kịch bản", "g"]
        - ["note", "Chờ khoảng 30–60 giây"]
      hi: 1
      text: "Muốn gì thì ghi vào ô <b>Yêu cầu thêm</b> (quay ở đâu, ai nói). Bấm <b>🎬 Viết kịch bản</b>, chờ khoảng 1 phút."
    - title: Kịch bản đã viết
      els:
        - ["h", "📂 Kịch bản đã viết"]
        - ["card", "3 câu mở đầu (hook)", "1 câu chính + 2 câu dự phòng", ""]
        - ["card", "Bảng quay 8 cột", "Cảnh · góc máy · lời thoại · chữ…", ""]
        - ["card", "Danh sách quay + caption", "Quay 1 lượt cho nhanh", ""]
        - ["btn", "📋 Copy kịch bản", "g"]
      hi: 4
      text: "Kịch bản hiện ở <b>📂 Kịch bản đã viết</b>. Đọc lại, rồi bấm <b>📋 Copy kịch bản</b> để gửi người quay qua Zalo."
ct-fb:
  title: Viết bài Facebook cá nhân cho sale
  steps:
    - title: Insight & nội dung
      els:
        - ["chips", ["📊 Tổng quan", "✍️ Tạo nội dung", "🧪 Chấm"], 1]
        - ["h", "🧰 Công cụ khác"]
        - ["card", "📸 Câu lệnh tạo ảnh", "AI viết câu lệnh cho ChatGPT", ""]
        - ["card", "📣 Bài Facebook cá nhân cho sale", "Bài đời thường + bình luận ghim", "g"]
        - ["btn", "📣 Mở", ""]
      hi: 4
      text: "Thẻ <b>✍️ Tạo nội dung</b> → kéo xuống <b>🧰 Công cụ khác</b> → ô <b>📣 Bài Facebook cá nhân cho sale</b> → bấm <b>📣 Mở</b>."
    - title: Bài Facebook cá nhân
      els:
        - ["in", "Nhóm khách", "Để trợ lý tự chọn"]
        - ["in", "Loại bài", "🔵 Nhận biết (không nhắc SP)"]
        - ["in", "Bình luận ghim mời khách", "Vào nhóm Zalo"]
        - ["btn", "✨ Viết 1 bài", "g"]
      hi: 3
      text: "Chọn nhóm khách, loại bài, và <b>bình luận ghim mời khách đi đâu</b> (nhóm Zalo, quà tặng, trang chủ). Bấm <b>✨ Viết 1 bài</b>, chờ khoảng 1 phút."
    - title: Bài Facebook cá nhân
      els:
        - ["card", "Bài đăng (không link)", "Kể chuyện đời thường", ""]
        - ["card", "Bình luận ghim + câu trả lời [LINK]", "[LINK] tự thành link riêng từng sale", ""]
        - ["btn2", "✏️ Sửa", "✅ Cho sale dùng", "g"]
      hi: 2
      text: "Đọc lại. Cần thì bấm <b>✏️ Sửa</b>. Ưng rồi bấm <b>✅ Cho sale dùng</b>. Sale thấy bài ở <b>Cài đặt → 📣 Bài đăng Facebook cá nhân</b>."
ct-anh:
  title: Viết câu lệnh tạo ảnh bằng AI
  steps:
    - title: Insight & nội dung
      els:
        - ["chips", ["📊 Tổng quan", "✍️ Tạo nội dung", "🧪 Chấm"], 1]
        - ["h", "🧰 Công cụ khác"]
        - ["card", "📸 Câu lệnh tạo ảnh", "Giữ nguyên bao bì thật", "g"]
        - ["btn", "📸 Viết câu lệnh", ""]
      hi: 3
      text: "Thẻ <b>✍️ Tạo nội dung</b> → <b>🧰 Công cụ khác</b> → ô <b>📸 Câu lệnh tạo ảnh</b> → bấm <b>📸 Viết câu lệnh</b>."
    - title: Câu lệnh tạo ảnh
      els:
        - ["in", "Sản phẩm", "Trà DILVANG"]
        - ["in", "Mục đích", "Ảnh kèm bài"]
        - ["in", "Khổ ảnh", "Vuông 1:1"]
        - ["in", "Dán nội dung bài (nếu có)", "Sáng nào cũng vội…"]
        - ["btn", "📸 Viết câu lệnh", "g"]
      hi: 4
      text: "Chọn sản phẩm (hoặc không), mục đích, khổ ảnh. Có bài rồi thì dán vào. Bấm <b>📸 Viết câu lệnh</b>."
    - title: 3 hướng ảnh
      els:
        - ["card", "Hướng 1: Bếp sáng sớm", "Góc máy, ánh sáng, màu, bố cục", ""]
        - ["btn", "📋 Copy câu lệnh", "g"]
        - ["card", "Hướng 2: Bàn làm việc", "…", ""]
        - ["note", "Dán vào ChatGPT / Gemini + ảnh SP thật"]
      hi: 1
      text: "AI viết <b>3 hướng ảnh</b>. Bấm <b>📋 Copy câu lệnh</b>, dán vào ChatGPT hoặc Gemini. Có sản phẩm thì <b>đính kèm ảnh sản phẩm thật</b>."
ct-nong:
  title: Ghi chuyện đang nóng cho trợ lý
  steps:
    - title: Insight & nội dung
      els:
        - ["chips", ["🗣 Lời khách", "👥 Nhóm", "⚙️ Cài đặt"], 2]
        - ["h", "📅 Dịp sắp tới & 🔥 chuyện nóng"]
        - ["card", "📅 Nhà giáo 20/11", "⏰ đến lúc chuẩn bị", "y"]
        - ["in", "🔥 Chuyện đang nóng", "Cả mạng bàn chuyện…"]
      hi: 3
      text: "Bấm thẻ <b>⚙️ Cài đặt</b>. Tìm ô <b>🔥 Chuyện đang nóng</b>. Ghi 1–3 câu: chuyện gì, mọi người đang nói gì."
    - title: Insight & nội dung
      els:
        - ["in", "Giai đoạn", "2 · Khẳng định lặp lại"]
        - ["in", "Mục tiêu bài", "Để trợ lý tự chọn"]
        - ["btn2", "💾 Lưu cho trợ lý", "🔍 AI xét trend", "g"]
      hi: 2
      text: "Chọn <b>giai đoạn</b> (xem bảng dưới). Không chắc chuyện có nên làm không thì bấm <b>🔍 AI xét trend</b> trước."
    - title: AI xét trend
      els:
        - ["card", "✅ LÀM · hợp Mẹ sau sinh", "3 hướng bài gợi ý", "g"]
        - ["btn", "✅ Dùng câu này cho ô 🔥", "g"]
        - ["card", "⛔ BỎ · tin buồn", "Không dùng", "r"]
      hi: 1
      text: "AI trả lời <b>✅ LÀM</b> hay <b>⛔ BỎ</b>, vì sao, và 3 hướng bài. Chuyện nên làm thì bấm <b>✅ Dùng câu này cho ô 🔥</b> là xong."
ct-big:
