    - title: Marketing
      els:
        - ["h", "📘 Quảng cáo Facebook đang chạy"]
        - ["card", "Hôm nay chi 1,2tr · ⭐ 1 SĐT 240k", "CPM · CTR · tin nhắn", "g"]
