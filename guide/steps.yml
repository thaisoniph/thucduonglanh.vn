  steps:
    - title: Insight & nội dung
      els:
        - ["chips", ["🗣 Lời khách", "👥 Nhóm khách", "⚙️ Cài đặt"], 1]
        - ["btn", "🔍 AI tìm nỗi lòng mới", "g"]
        - ["btn2", "📥 Dán kết quả skill", "➕ Thêm nhóm", ""]
      hi: 1
