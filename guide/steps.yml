    - title: Tìm insight
      els:
        - ["in", "Sản phẩm", "Sữa hạt Curcumin"]
        - ["in", "Nhóm khách mẫu", "Để AI đề xuất"]
        - ["in", "Mục tiêu", "Bán hàng"]
        - ["btn", "🔍 Tìm insight", "g"]
